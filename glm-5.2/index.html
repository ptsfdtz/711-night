<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rainy Night Konbini</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06080f;}
  canvas{display:block;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Rainy Night Convenience Store — Toon Diorama
   ============================================================ */

const DAY = false;

/* ---------- Renderer / Scene / Camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance', preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// gradient night-sky backdrop (atmospheric depth, not flat black)
function skyBackdrop(){
  const c=document.createElement('canvas'); c.width=64; c.height=256;
  const g=c.getContext('2d');
  const rg=g.createLinearGradient(0,0,0,256);
  rg.addColorStop(0.0,'#05070f');
  rg.addColorStop(0.45,'#0a1024');
  rg.addColorStop(0.72,'#13203c');
  rg.addColorStop(0.85,'#1c2c50');
  rg.addColorStop(1.0,'#26395f');
  g.fillStyle=rg; g.fillRect(0,0,64,256);
  // faint stars
  g.fillStyle='rgba(200,210,255,0.5)';
  for(let i=0;i<60;i++){ g.globalAlpha=Math.random()*0.5; g.fillRect(Math.random()*64|0, Math.random()*150|0, 1,1); }
  g.globalAlpha=1;
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
scene.background = skyBackdrop();
scene.fog = new THREE.Fog(0x121a30, 30, 78);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 220);
camera.position.set(13, 11, 15.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1.5, -1);
controls.minDistance = 8;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * 0.495;
controls.rotateSpeed = 0.7;

/* ---------- Toon gradient + helpers ---------- */
function toonGradient(){
  const data = new Uint8Array([
    68,72,86,255,   68,72,86,255,
    135,140,158,255, 135,140,158,255,
    215,220,235,255, 235,240,255,255
  ]);
  const t = new THREE.DataTexture(data, 6, 1, THREE.RGBAFormat);
  t.needsUpdate = true;
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  return t;
}
const GRAD = toonGradient();

function mat(color, opts={}){
  return new THREE.MeshToonMaterial({ color, gradientMap:GRAD, ...opts });
}
function emat(color, emissive, ei=1.0, opts={}){
  return new THREE.MeshToonMaterial({ color, gradientMap:GRAD, emissive:new THREE.Color(emissive), emissiveIntensity:ei, ...opts });
}
// outline (inverted hull) — boxy shapes scale well
function outline(mesh, scale=1.05, color=0x05070d){
  const o = new THREE.Mesh(mesh.geometry, new THREE.MeshBasicMaterial({ color, side:THREE.BackSide }));
  o.scale.multiplyScalar(scale);
  mesh.add(o);
  return mesh;
}
function box(w,h,d, material, sc=1.05){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  outline(m, sc);
  return m;
}
function cyl(rt,rb,h,material,seg=14){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), material);
  outline(m,1.06);
  return m;
}
function add(p,x,y,z,parent){ p.position.set(x,y,z); (parent||scene).add(p); return p; }

/* ---------- Glow / reflection textures ---------- */
function glowTex(stops){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(64,64,0,64,64,64);
  stops.forEach(s=>rg.addColorStop(s[0],s[1]));
  g.fillStyle=rg; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const GLOW_WARM = glowTex([[0,'rgba(255,214,150,1)'],[0.4,'rgba(255,180,90,0.55)'],[1,'rgba(255,170,80,0)']]);
const GLOW_CYAN = glowTex([[0,'rgba(150,230,255,1)'],[0.4,'rgba(80,180,255,0.5)'],[1,'rgba(60,150,255,0)']]);
const GLOW_PINK = glowTex([[0,'rgba(255,150,200,1)'],[0.4,'rgba(255,90,170,0.5)'],[1,'rgba(220,70,150,0)']]);
const GLOW_WHITE= glowTex([[0,'rgba(230,240,255,1)'],[0.4,'rgba(180,210,255,0.5)'],[1,'rgba(150,190,255,0)']]);
function glowSprite(tex,scale,colorTint){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, color:colorTint||0xffffff }));
  s.scale.setScalar(scale);
  return s;
}
// wet-ground vertical reflection streak (additive)
function reflectQuad(color, w=1.4, h=2.6){
  const c=document.createElement('canvas'); c.width=64; c.height=128;
  const g=c.getContext('2d');
  const rg=g.createLinearGradient(0,0,0,128);
  rg.addColorStop(0,'rgba(255,255,255,0.85)');
  rg.addColorStop(0.5,'rgba(255,255,255,0.25)');
  rg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=rg; g.fillRect(0,0,64,128);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.MeshBasicMaterial({ map:t, color, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.8 });
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h), m);
  mesh.rotation.x=-Math.PI/2;
  return mesh;
}

/* ---------- Lights ---------- */
scene.add(new THREE.HemisphereLight(0x39496e, 0x0a0c12, 0.55));
scene.add(new THREE.AmbientLight(0x2a3650, 0.5));
const moon = new THREE.DirectionalLight(0x9fb6e0, 0.55);
moon.position.set(-14, 24, -10);
scene.add(moon);

const insideLight = new THREE.PointLight(0xffd6a0, 30, 18, 1.6);
insideLight.position.set(0, 2.5, -2.8);
scene.add(insideLight);
const insideLight2 = new THREE.PointLight(0xffd2a0, 18, 14, 1.8);
insideLight2.position.set(-1.5, 2.4, -4.5);
scene.add(insideLight2);

const streetLight = new THREE.PointLight(0xffb066, 9, 12, 1.8);
streetLight.position.set(5.2, 4.2, 2.4);
scene.add(streetLight);

const vendLight = new THREE.PointLight(0x9fe0ff, 5, 7, 2.0);
vendLight.position.set(3.4, 1.6, 2.6);
scene.add(vendLight);

/* ============================================================
   BASE / GROUND
   ============================================================ */
const BASE = 20; // half-extent visual
const root = new THREE.Group();
scene.add(root);

// Plinth
const plinth = box(BASE, 0.7, BASE, mat(0x161a28), 1.0);
add(plinth, 0, -0.35, 0, root);
// beveled rim
const rim = box(BASE+0.5, 0.25, BASE+0.5, mat(0x0c0f18), 1.0);
add(rim, 0, -0.62, 0, root);

// Asphalt (wet)
const asphaltMat = new THREE.MeshStandardMaterial({ color:0x12161f, roughness:0.42, metalness:0.55 });
const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(BASE, BASE), asphaltMat);
asphalt.rotation.x = -Math.PI/2;
add(asphalt, 0, 0.001, 0, root);

// Sidewalk (raised slab) — L-shape around store front + side
const swMat = mat(0x3a4254, {});
function slab(w,d,x,z){
  const s = box(w, 0.22, d, swMat, 1.03);
  add(s, x, 0.11, z, root);
  return s;
}
// south sidewalk strip in front of store
slab(9.4, 2.2, 0, 1.4);
// east sidewalk strip
slab(2.2, 9.4, 4.0, -2.6);
// corner square
slab(2.2, 2.2, 4.0, 1.4);

// Curb edge lines (light stone)
const curbMat = mat(0x55607a);
function curb(w,d,x,z){ const c=box(w,0.06,d,curbMat,1.04); add(c,x,0.24,z,root); return c; }
curb(9.4,0.12,0,0.32);
curb(0.12,9.4,3.1,-2.6);

// Road markings — center line (yellow dashed) on south road
const lineMat = emat(0x222838, 0xffcf57, 0.5);
for(let i=0;i<6;i++){ const l=box(0.9,0.02,0.12,lineMat,1.02); add(l,-4.2+i*1.7,0.012,3.2,root); }
// stop line
const sl=box(0.14,0.02,3.0,emat(0x222838,0xffffff,0.4),1.02); add(sl,4.6,0.012,3.2,root);
// crosswalk stripes (faint emissive wet look)
for(let i=0;i<5;i++){ const cs=box(0.5,0.02,0.7,emat(0x2a3042,0xdfe6ff,0.55),1.02); add(cs, 6.2+i*0.9, 0.012, 3.2, root); }

// Puddle patches (darker, slightly reflective sheen)
const pudMat = new THREE.MeshStandardMaterial({ color:0x0a0e18, roughness:0.12, metalness:0.9 });
const puddles=[[0.5,3.4,1.7],[3.0,4.6,1.3],[-2.4,3.0,1.5],[5.0,1.0,1.2],[2.0,2.2,1.0],[-3.5,1.6,1.1]];
const puddleMeshes=[];
puddles.forEach(p=>{
  const pg=new THREE.Mesh(new THREE.CircleGeometry(p[2],20), pudMat);
  pg.rotation.x=-Math.PI/2;
  add(pg, p[0], 0.013, p[1], root);
  puddleMeshes.push(pg);
});

// Drain grate
const grate = box(0.5,0.04,0.3,mat(0x10141d),1.05); add(grate,1.6,0.26,0.32,root);
for(let i=0;i<4;i++){ const b=box(0.42,0.06,0.03,mat(0x05070d),1.0); add(b,1.6,0.27,0.18+i*0.07,root); }

// Corner guardrail (east road edge)
const railMat = mat(0x6b7280);
function railpost(x,z){ const p=cyl(0.04,0.04,0.5,railMat,8); add(p,x,0.5,z,root); return p; }
for(let i=0;i<5;i++){ railpost(3.2, -2.0+i*1.5); }
const railbar = box(0.04,0.04,6.2,railMat,1.04); add(railbar,3.2,0.7,-0.5,root);
const railbar2 = box(0.04,0.04,6.2,railMat,1.04); add(railbar2,3.2,0.4,-0.5,root);

/* ============================================================
   CONVENIENCE STORE SHELL
   footprint x:[-4.2,4.2] z:[-6.2,0.2]  height ~3
   facade (south) at z=0.2 facing +z
   ============================================================ */
const SW = 4.2, SD = 6.2, SH = 3.0;
const store = new THREE.Group();
add(store, 0,0,0, root);

const wallMat = mat(0xcdd2dc);       // bright cream-white (reads lit)
const wallSideMat = mat(0x9aa3b4);
const trimMat = mat(0x2a3142);
const roofMat = mat(0x3a4254);

// Back wall (north)
const back = box(8.4, SH, 0.18, wallSideMat,1.03); add(back,0,SH/2,-SD,store);
// West wall
const west = box(0.18, SH, 12.4, wallSideMat,1.03); add(west,-SW,SH/2,0,store);
// East wall
const east = box(0.18, SH, 12.4, wallSideMat,1.03); add(east, SW,SH/2,0,store);
// Front corner posts
const postL = box(0.22, SH+0.1, 0.22, trimMat,1.04); add(postL,-SW,SH/2,0.2,store);
const postR = box(0.22, SH+0.1, 0.22, trimMat,1.04); add(postR, SW,SH/2,0.2,store);

// Interior floor (warm)
const floorMat = emat(0x6e5a3e, 0x3a2a14, 0.25);
const ifloor = new THREE.Mesh(new THREE.PlaneGeometry(8.3,12.3), floorMat);
ifloor.rotation.x=-Math.PI/2; add(ifloor,0,0.06,-0.0,store);

// Floor guide line (tape)
const tapeMat = emat(0x2a3042,0xffcf6a,0.6);
const tape = box(7.6,0.02,0.12,tapeMat,1.0); add(tape,0,0.085,0.7,store);

// Ceiling
const ceil = box(8.3,0.12,12.3, mat(0xe8ecf4)); add(ceil,0,SH-0.06,-0.0,store);

// Ceiling light boxes (bright warm emissive)
const cLightMat = emat(0xfff2d6, 0xfff0d0, 2.6);
for(let i=0;i<4;i++){ const lb=box(3.2,0.1,1.2,cLightMat,1.0); add(lb, 0, SH-0.2, -4.5+i*2.6, store);
  // glow
  const gl=glowSprite(GLOW_WARM,2.2); gl.position.set(0,SH-0.25,-4.5+i*2.6); store.add(gl);
}

// ---- Glass facade (south) ----
const glassMat = new THREE.MeshToonMaterial({ color:0x9fc6ff, gradientMap:GRAD, transparent:true, opacity:0.22, emissive:new THREE.Color(0x223044), emissiveIntensity:0.4, depthWrite:false });
function glassPanel(w,h,x,y){
  const g=new THREE.Mesh(new THREE.PlaneGeometry(w,h), glassMat);
  g.position.set(x,y,0.2);
  store.add(g);
  return g;
}
// big front windows
glassPanel(2.5,1.9,-2.0,1.35);
glassPanel(2.5,1.9, 2.0,1.35);
// transom window strip above door
const trans = new THREE.Mesh(new THREE.PlaneGeometry(8.0,0.55), glassMat); trans.position.set(0,2.55,0.2); store.add(trans);

// mullions (window frames)
const frameMat = mat(0x232a3a);
function mullion(w,h,x,y){ const f=box(w,h,0.08,frameMat,1.04); add(f,x,y,0.2,store); }
mullion(0.08,1.9,-3.25,1.35); mullion(0.08,1.9,-0.75,1.35); mullion(0.08,1.9,0.75,1.35); mullion(0.08,1.9,3.25,1.35);
mullion(5.0,0.08,0,0.4); mullion(5.0,0.08,0,2.3);
// transom frame
const tf=box(8.0,0.1,0.08,frameMat,1.04); add(tf,0,2.55,0.2,store);

// ---- Sign band (above transom) ----
const signBand = box(8.2,0.7,0.16, mat(0x0e1220),1.03); add(signBand,0,2.95,0.2,store);
// logo circle + "24"
const signMatA = emat(0xff6a8a, 0xff3a6a, 1.5); // pink-red accent (konbini vibe)
const signMatB = emat(0xfff2d0, 0xffe6b0, 1.4);
const logoBg = box(1.0,1.0,0.05,emat(0xff5070,0xff3a5a,1.4),1.02); add(logoBg,-1.8,2.95,0.3,store);
// big "24" using boxes
function digit2(x){ const g=new THREE.Group();
  const t=box(0.34,0.1,0.05,signMatB,1.0); add(t,0,0.4,0,g);
  const m=box(0.34,0.1,0.05,signMatB,1.0); add(m,0,0,0,g);
  const b=box(0.34,0.1,0.05,signMatB,1.0); add(b,0,-0.4,0,g);
  const tr=box(0.1,0.4,0.05,signMatB,1.0); add(tr,0.12,0.2,0,g);
  const br=box(0.1,0.4,0.05,signMatB,1.0); add(br,0.12,-0.2,0,g);
  const tl=box(0.1,0.3,0.05,signMatB,1.0); add(tl,-0.12,0.25,0,g);
  g.position.set(x,2.95,0.32); store.add(g); return g;}
digit2(0.4);
// small bar text
const bar=box(1.6,0.12,0.05,emat(0x7fe0ff,0x7fe0ff,1.3),1.0); add(bar,2.0,2.95,0.32,store);
// glow behind sign
const sg=glowSprite(GLOW_PINK,3.2); sg.position.set(-1.8,2.95,0.5); store.add(sg);
const sg2=glowSprite(GLOW_WARM,3.0); sg2.position.set(0.6,2.95,0.5); store.add(sg2);
const FLICK = { mats:[signMatA,signMatB,logoBg.material,bar.material], base:[2.2,2.0,2.0,1.8], glow:[sg,sg2] };

// ---- Awning / overhang ----
const awnMat = mat(0x2a3550);
const awn = box(8.6,0.12,1.5, awnMat,1.03); add(awn,0,2.25,0.95,store);
// awning stripe valance
const valMat = emat(0xc83a5a,0x4a1020,0.0);
for(let i=0;i<10;i++){ const v=box(0.7,0.18,0.04, i%2?emat(0xff5577,0x4a1020,0):emat(0xf5f5f5,0x222222,0),1.0); add(v,-3.85+i*0.78,2.16,1.68,store); }
// awning supports
const supMat=mat(0x222a3a);
const s1=cyl(0.05,0.05,2.2,supMat,8); add(s1,-3.9,1.1,1.6,store);
const s2=cyl(0.05,0.05,2.2,supMat,8); add(s2,3.9,1.1,1.6,store);

// ---- Entrance / sliding automatic door ----
const doorFrame = box(1.9,2.1,0.12, trimMat,1.04); add(doorFrame,0,1.05,0.2,store);
const doorTrack = box(2.0,0.06,0.1, mat(0x11151f),1.0); add(doorTrack,0,2.12,0.2,store);
const doorGlassMat = new THREE.MeshToonMaterial({ color:0x9fc6ff, gradientMap:GRAD, transparent:true, opacity:0.16, emissive:new THREE.Color(0xffd9a0), emissiveIntensity:0.5, depthWrite:false });
const doorL = new THREE.Mesh(new THREE.PlaneGeometry(0.95,2.0), doorGlassMat);
doorL.position.set(-0.48,1.05,0.18); store.add(doorL);
const doorR = new THREE.Mesh(new THREE.PlaneGeometry(0.95,2.0), doorGlassMat);
doorR.position.set(0.48,1.05,0.18); store.add(doorR);
// door frame bars
const dlb=box(0.04,2.0,0.06,frameMat,1.0); const drb=box(0.04,2.0,0.06,frameMat,1.0);
store.add(dlb); store.add(drb); dlb.position.set(-0.95,1.05,0.2); drb.position.set(0.95,1.05,0.2);
const DOOR = { L:doorL, R:doorR, lb:dlb, rb:drb, t:0, open:false, next:4+Math.random()*3 };

// Door mat
const matMat = emat(0x2a3042,0x8a5a2a,0.05);
const dmat=box(1.7,0.04,0.7,matMat,1.03); add(dmat,0,0.27,1.0,root);

// ---- Roof ----
const roof = box(8.8,0.2,12.8, roofMat,1.03); add(roof,0,SH+0.0,-0.0,store);
const roofTrim = box(9.0,0.1,13.0, mat(0x4a5468),1.02); add(roofTrim,0,SH+0.12,-0.0,store);
// AC outdoor unit on roof
const acu=box(1.2,0.8,0.7, mat(0x8a929e),1.04); add(acu,-2.8,SH+0.6,-3.0,store);
const acu2=box(1.2,0.8,0.7, mat(0x8a929e),1.04); add(acu2,2.6,SH+0.6,-3.0,store);

// ---- Side details ----
// east side small frosted window
const sideWin=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.0), glassMat);
sideWin.position.set(SW,1.6,-3.5); sideWin.rotation.y=Math.PI/2; store.add(sideWin);
const swf=box(0.06,1.0,1.7,frameMat,1.0); add(swf,SW,1.6,-3.5,store);

// back door (solid)
const backDoor=box(1.0,2.0,0.12, mat(0x333a4a),1.03); add(backDoor,-2.2,1.0,-SD+0.06,store);

// alley entrance on west side (a recessed dark gap + neighbor wall)
const alleyWall=box(0.18,SH,3.0,mat(0x3a4254),1.03); add(alleyWall,-SW-1.4,SH/2,2.5,root);
const alleyWall2=box(2.8,SH,0.18,mat(0x2a3042),1.03); add(alleyWall2,-SW-0.2,SH/2,4.0,root);
const alleyGround=box(2.6,0.02,2.8, mat(0x14181f),1.0); add(alleyGround,-SW-0.1,0.13,2.5,root);

/* ============================================================
   INTERIOR
   ============================================================ */
const INT = new THREE.Group(); store.add(INT);

// back wall panel (interior face, warm cream) with posters
const bwInt = box(8.0,SH-0.2,0.05, mat(0xeae0cc),1.0); add(bwInt,0,SH/2-0.1,-SD+0.1,INT);
// posters
const posterCols=[0xff5a5a,0x5acfff,0xffd24a,0x6affb0];
posterCols.forEach((c,i)=>{
  const p=box(0.9,1.2,0.02, emat(0xffffff,c,0.0, {color:0xffffff}),1.0);
  // use basic colored emissive poster
  const pm=new THREE.MeshToonMaterial({color:0xf0f0f0, gradientMap:GRAD, emissive:new THREE.Color(c), emissiveIntensity:0.0});
  p.material=pm;
  add(p,-3.0+i*2.0, 2.0, -SD+0.14, INT);
});

// ---- Gondola shelves (two rows running east-west) ----
const shelfMat = mat(0x4a5266);
const shelfTopMat = mat(0x5a6478);
function gondola(x,z,len=5.2){
  const g=new THREE.Group();
  const base=box(len,0.1,0.7, shelfMat,1.03); add(base,0,0.55,z,g);
  for(let r=0;r<4;r++){
    const sh=box(len,0.05,0.6, shelfTopMat,1.0); add(sh,0,0.9+r*0.55,z+0.02,g);
    const back=box(len,1.4,0.04, shelfMat,1.0); add(back,0,1.1+r*0.0,z-0.3,g);
  }
  // vertical posts
  [-len/2+0.1,len/2-0.1].forEach(px=>{ const v=box(0.08,2.3,0.5,shelfMat,1.0); add(v,px,1.15,z,g); });
  g.position.set(x,0.06,z);
  INT.add(g);

/* ============================================================
   ANIMATION
   ============================================================ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  // ---- Rain ----
  const arr=rainGeo.attributes.position.array;
  for(let i=0;i<RAIN_N;i++){
    const d=rdat[i];
    d.y-=d.spd*(60*dt);
    if(d.y<0.05){
      // occasionally spawn a ripple where it lands on road
      if(Math.random()<0.25 && (Math.abs(d.x)<6) && d.z>0.2){
        const r=rips.find(r=>r.life>=r.max); if(r){ r.life=0; r.x=d.x; r.z=d.z; r.scale=0.1; r.m.position.set(d.x,0.02,d.z);}
      }
      d.y=12+Math.random()*4;
      d.x=(Math.random()-0.5)*BASE*1.4;
      d.z=(Math.random()-0.5)*BASE*1.4;
    }
    arr[i*6]=d.x; arr[i*6+1]=d.y; arr[i*6+2]=d.z;
    arr[i*6+3]=d.x; arr[i*6+4]=d.y+d.len; arr[i*6+5]=d.z;
  }
  rainGeo.attributes.position.needsUpdate=true;

  // ---- Drips ----
  const da=dripGeo.attributes.position.array;
  for(let i=0;i<DRIP_N;i++){
    const d=ddat[i];
    if(!d.on){ d.d-=dt; if(d.d<=0){ d.on=true; d.y=2.2; d.v=0; d.x=(Math.random()-0.5)*7.5; d.z=1.65+Math.random()*0.15; } }
    else{ d.v+=8*dt; d.y-=d.v*dt; if(d.y<0.05){ d.on=false; d.d=1+Math.random()*2.5; d.y=-10;
      const r=rips.find(r=>r.life>=r.max); if(r){ r.life=0; r.x=d.x; r.z=d.z; r.scale=0.1; r.m.position.set(d.x,0.02,d.z);} } }
    da[i*3]=d.x; da[i*3+1]=d.y; da[i*3+2]=d.z;
  }
  dripGeo.attributes.position.needsUpdate=true;

  // ---- Ripples ----
  for(const r of rips){
    if(r.life<r.max){
      r.life+=dt; r.scale+=dt*1.0;
      const k=r.life/r.max;
      r.m.scale.setScalar(Math.max(0.1, r.scale*3.2));
      r.m.material.opacity=0.5*(1-k);
    } else { r.m.material.opacity=0; }
  }

  // ---- Sign flicker ----
  const flick=0.6+0.4*Math.sin(t*7)+ (Math.random()<0.02? -0.5:0) + (Math.sin(t*23)*0.06);
  FLICK.mats.forEach((m,i)=> m.emissiveIntensity = FLICK.base[i]*Math.max(0.15,flick));
  FLICK.glow.forEach(s=> s.material.opacity = Math.max(0.2,flick));

  // ---- Door open/close ----
  DOOR.t+=dt;
  if(!DOOR.open && DOOR.t>DOOR.next){ DOOR.open=true; DOOR.t=0; }
  if(DOOR.open){
    const k=Math.min(1,DOOR.t/0.8);
    const e=1-Math.pow(1-k,3);
    const open=0.92*e;
    DOOR.L.position.x=-0.48-open;
    DOOR.R.position.x=0.48+open;
    DOOR.lb.position.x=-0.95-open;
    DOOR.rb.position.x=0.95+open;
    if(DOOR.t>3.2){ // hold then close
      const k2=Math.min(1,(DOOR.t-3.2)/0.8);
      const e2=1-Math.pow(1-k2,3);
      const open2=0.92*(1-e2);
      DOOR.L.position.x=-0.48-open2; DOOR.R.position.x=0.48+open2;
      DOOR.lb.position.x=-0.95-open2; DOOR.rb.position.x=0.95+open2;
      if(DOOR.t>4.0){ DOOR.open=false; DOOR.t=0; DOOR.next=5+Math.random()*5; }
    }
  }

  // ---- Window streaks slide ----
  streakTexs.offset.y = -(t*0.15)%1;
  streakTexs.offset.x = (t*0.03)%1;

  // ---- Traffic light ----
  TL.t+=dt;
  const cyc=TL.t%9;
  TL.red.emissiveIntensity=1.0; TL.yel.emissiveIntensity=0.05; TL.grn.emissiveIntensity=0.05;
  if(cyc>4 && cyc<6){ TL.red.emissiveIntensity=0.05; TL.grn.emissiveIntensity=1.0; }
  else if(cyc>=6){ TL.red.emissiveIntensity=0.05; TL.yel.emissiveIntensity=1.0; TL.grn.emissiveIntensity=0.05; }

  // ---- Reflection shimmer ----
  for(const r of REFL){ r.m.material.opacity = r.base*(0.7+0.3*Math.sin(t*3+r.ph)); }

  controls.update();
  renderer.render(scene,camera);
}
animate();

/* ---------- Resize ---------- */
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
