<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>711 Night · 预览入口</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #14171f;
    --card-hover: #1b1f2a;
    --border: #262b38;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 28px 32px 18px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
  header span { color: var(--muted); font-size: 13px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    padding: 8px 32px 40px;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 720px)  { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    background: var(--card-hover);
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .card-head .name { font-size: 14px; font-weight: 600; }
  .card-head .path { font-size: 11px; color: var(--muted); margin-left: 8px; }
  .open-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 6px;
    cursor: pointer;
    transition: all .15s ease;
    text-decoration: none;
  }
  .open-btn:hover { color: var(--text); border-color: var(--accent); }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    background: #fff;
    overflow: hidden;
  }
  .thumb iframe {
    position: absolute;
    top: 0; left: 0;
    width: 200%;
    height: 200%;
    border: 0;
    transform: scale(.5);
    transform-origin: top left;
    pointer-events: none;
  }

  /* Fullscreen overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 1000;
    display: none;
    flex-direction: column;
  }
  .overlay.active { display: flex; }
  .overlay-bar {
    height: 44px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: #101319;
    border-bottom: 1px solid var(--border);
  }
  .overlay-bar .title { font-size: 14px; font-weight: 600; }
  .overlay-bar .actions { display: flex; gap: 8px; }
  .overlay-bar button, .overlay-bar a {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
  }
  .overlay-bar button:hover, .overlay-bar a:hover { border-color: var(--accent); }
  .overlay iframe { flex: 1 1 auto; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>

<header>
  <h1>711 Night · 预览入口</h1>
  <span>点击卡片全屏预览，或在新标签页打开</span>
</header>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="overlay-bar">
    <div class="title" id="ovTitle"></div>
    <div class="actions">
      <a id="ovNew" href="#" target="_blank" rel="noopener">新标签页打开</a>
      <button id="ovClose">关闭 (Esc)</button>
    </div>
  </div>
  <iframe id="ovFrame" src="" title="preview"></iframe>
</div>

<script>
  const pages = [
    { name: "GPT 5.6 Luna", dir: "GPT-5.6Luna" },
    { name: "GPT 6 Astra", dir: "GPT-6Astra" },
    { name: "GPT 6 Luna", dir: "GPT-6Luna" },
    { name: "DeepSeek V4.1 Flash", dir: "DeepSeekV4.1Flash" },
    { name: "Qwen 3.6 Flash", dir: "qwen3.6-flash" },
    { name: "MiMo V2.6 Flash", dir: "MiMo-V2.6-Flash" },
    { name: "MiMo V2.6 Pro", dir: "MIMo-V2.6-Pro" },
    { name: "Doubao 2.1", dir: "doubao2.1" },
    { name: "GLM 5.3 Flash", dir: "GLM-5.3-Flash" },
    { name: "Hy4 Preview", dir: "Hy4preview" },
    { name: "Ling 3.0 Flash", dir: "Ling3.0-flash" },
    { name: "LongCat 2.0", dir: "LongCat2.0" },
    { name: "MiniMax M3", dir: "MiniMax-M3" },
    { name: "Muse Spark 1.3", dir: "MuseSpark1.3" },
    { name: "Nemotron 3.5 Lightning", dir: "Nemotron3.5Lightning" }
  ];

  const grid = document.getElementById("grid");
  const overlay = document.getElementById("overlay");
  const ovFrame = document.getElementById("ovFrame");
  const ovTitle = document.getElementById("ovTitle");
  const ovNew = document.getElementById("ovNew");

  // Change this value whenever a scene deployment needs viewers to reload its assets.
  const release = "20260923-previews";
  pages.forEach(p => {
    const url = p.dir + "/index.html?v=" + release;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-head">
        <div><span class="name">${p.name}</span><span class="path">${p.dir}/</span></div>
        <a class="open-btn" href="${url}" target="_blank" rel="noopener">打开</a>
      </div>
      <div class="thumb"><iframe src="${url}" loading="lazy" scrolling="no" tabindex="-1"></iframe></div>
    `;
    card.addEventListener("click", e => {
      if (e.target.closest(".open-btn")) return;
      openFullscreen(p, url);
    });
    grid.appendChild(card);
  });

  function openFullscreen(p, url) {
    ovTitle.textContent = p.name;
    ovNew.href = url;
    ovFrame.src = url;
    overlay.classList.add("active");
    document.body.style.overflow = "hidden";
  }
  function closeFullscreen() {
    overlay.classList.remove("active");
    ovFrame.src = "";
    document.body.style.overflow = "";
  }

  document.getElementById("ovClose").addEventListener("click", closeFullscreen);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && overlay.classList.contains("active")) closeFullscreen();
  });
</script>
</body>
</html>
