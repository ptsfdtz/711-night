<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>711 Night · 预览入口</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #14171f;
    --card-hover: #1b1f2a;
    --border: #262b38;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 28px 32px 18px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  header .titles { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
  header span { color: var(--muted); font-size: 13px; }

  .gh {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--muted);
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .gh:hover { color: var(--text); border-color: var(--accent); background: var(--card-hover); }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    padding: 8px 32px 40px;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 720px)  { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: inherit;
    text-decoration: none;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    background: var(--card-hover);
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .card-head .name { font-size: 14px; font-weight: 600; }
  .card-head .path { font-size: 11px; color: var(--muted); margin-left: 8px; }
  .card-head .go { font-size: 13px; color: var(--muted); }
  .card:hover .go { color: var(--accent); }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    background: #0e1118;
    overflow: hidden;
  }
  .thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>

<header>
  <div class="titles">
    <h1>711 Night · 预览入口</h1>
    <span>点击卡片即可在新标签页打开互动场景</span>
  </div>
  <a class="gh" href="https://github.com/ptsfdtz/711-night" target="_blank" rel="noopener" title="GitHub 仓库" aria-label="GitHub 仓库">
    <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" fill="currentColor">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </a>
</header>

<div class="grid" id="grid"></div>

<script>
  const pages = [
    { name: "GPT 5.6 Terra", dir: "gpt-5.6-terra" },
    { name: "GPT 5.6 Luna", dir: "gpt-5.6-luna" },
    { name: "GPT 5.6 Sol", dir: "gpt-5.6-sol" },
    { name: "GPT 6 Astra", dir: "gpt-6-astra" },
    { name: "GPT 6 Luna", dir: "gpt-6-luna" },
    { name: "GPT 6 Sol", dir: "gpt-6-sol" },
    { name: "GPT 6.1 Sol", dir: "gpt-6.1-sol", entry: "Rainy-Corner.html" },
    { name: "DeepSeek V4.1 Flash", dir: "deepseek-v4.1-flash" },
    { name: "DeepSeek V4 Pro", dir: "deepseek-v4-pro" },
    { name: "Qwen 3.6 Flash", dir: "qwen-3.6-flash" },
    { name: "Qwen 3.8 Flash", dir: "qwen-3.8-flash" },
    { name: "Qwen 3.8 27B", dir: "qwen-3.8-27b" },
    { name: "Qwen 3.8 Max", dir: "qwen-3.8-max" },
    { name: "MiMo V2.6 Flash", dir: "mimo-v2.6-flash" },
    { name: "MiMo V2.6 Pro", dir: "mimo-v2.6-pro" },
    { name: "Doubao 2.1", dir: "doubao-2.1" },
    { name: "GLM 5.1", dir: "glm-5.1" },
    { name: "GLM 5.3 Flash", dir: "glm-5.3-flash" },
    { name: "Gemini 3.8 Flash", dir: "gemini-3.8-flash" },
    { name: "Grok 4.7", dir: "grok-4.7" },
    { name: "Hy4 Preview", dir: "hy4-preview" },
    { name: "Kimi K3", dir: "kimi-k3" },
    { name: "Ling 3.0 Flash", dir: "ling-3.0-flash" },
    { name: "LongCat 2.0", dir: "longcat-2.0" },
    { name: "MiniMax M3", dir: "minimax-m3" },
    { name: "Muse Spark 1.3", dir: "muse-spark-1.3" },
    { name: "Nemotron 3.5 Lightning", dir: "nemotron-3.5-lightning" },
    { name: "Claude Haiku 5.5", dir: "ClaudeHaiku5.5" },
    { name: "Space Bunny Free", dir: "SpaceBunnyFree" }
  ];

  // Change this value whenever a scene deployment needs viewers to reload its assets.
  const release = "20261009-new-scenes";

  const grid = document.getElementById("grid");
  const frag = document.createDocumentFragment();

  pages.forEach(p => {
    const url = p.dir + "/" + (p.entry || "index.html") + "?v=" + release;
    const preview = "docs/previews/" + p.dir.toLowerCase() + ".png";

    const card = document.createElement("a");
    card.className = "card";
    card.href = url;
    card.target = "_blank";
    card.rel = "noopener";
    card.innerHTML = `
      <div class="card-head">
        <div><span class="name">${p.name}</span><span class="path">${p.dir}/</span></div>
        <span class="go" aria-hidden="true">↗</span>
      </div>
      <div class="thumb">
        <img src="${preview}" alt="${p.name} 生成的雨夜便利店场景预览" loading="lazy" decoding="async">
      </div>
    `;
    frag.appendChild(card);
  });

  grid.appendChild(frag);
</script>
</body>
</html>
