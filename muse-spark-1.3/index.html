import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- renderer / scene / camera ---------- */

renderer.shadowMap.enabled = true;

scene.background = new THREE.Color(0x070b18);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(13.5, 10.5, 14.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, -1);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 32;
controls.maxPolarAngle = 1.45;
controls.minPolarAngle = 0.15;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;

/* ---------- toon gradient ---------- */
const gradData = new Uint8Array([120, 170, 220, 255]);
const gradMap = new THREE.DataTexture(gradData, 4, 1, THREE.RedFormat);
gradMap.minFilter = THREE.NearestFilter;
gradMap.magFilter = THREE.NearestFilter;
gradMap.generateMipmaps = false;
gradMap.needsUpdate = true;

const outlineMat = new THREE.MeshBasicMaterial({ color: 0x141828, side: THREE.BackSide });

function toon(color, o={}) {
  return new THREE.MeshToonMaterial({
    color, gradientMap: gradMap,
    emissive: o.emissive || 0x000000,
    emissiveIntensity: o.emissiveIntensity ?? 1,
    transparent: o.transparent || false,
    opacity: o.opacity ?? 1,
  });
}
function BOX(w,h,d,color,o={}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), o.mat || toon(color, o));
  m.position.set(o.x||0, o.y||0, o.z||0);
  if(o.ry) m.rotation.y = o.ry;
  if(o.rx) m.rotation.x = o.rx;
  if(o.rz) m.rotation.z = o.rz;
  m.castShadow = o.cast !== false;
  m.receiveShadow = true;
  if(o.outline !== false && !o.mat) {
    const ol = new THREE.Mesh(m.geometry, outlineMat);
    ol.scale.multiplyScalar(1.035);
    m.add(ol);
  }
  (o.parent || scene).add(m);
  return m;
}
function CYL(rt,rb,h,color,o={}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,o.seg||18), o.mat || toon(color,o));
  m.position.set(o.x||0,o.y||0,o.z||0);
  if(o.rx) m.rotation.x=o.rx; if(o.rz) m.rotation.z=o.rz; if(o.ry) m.rotation.y=o.ry;
  m.castShadow = true; m.receiveShadow = true;
  if(o.outline !== false && !o.mat){ const ol=new THREE.Mesh(m.geometry,outlineMat); ol.scale.multiplyScalar(1.04); m.add(ol); }
  (o.parent||scene).add(m); return m;
}
function tube(a,b,r,color,o={}) {
  const dir = new THREE.Vector3().subVectors(b,a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10), o.mat||toon(color,o));
  m.position.copy(a).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  m.castShadow=true;
  (o.parent||scene).add(m); return m;
}
function canvasTex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  return t;
}
function glowSprite(color, size, opacity=0.55){
  const tex = canvasTex(128,128,(g)=>{
    const gr=g.createRadialGradient(64,64,2,64,64,62);
    gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.35,color); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(0,0,128,128);
  });
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false}));
  s.scale.setScalar(size); return s;
}

/* ---------- puddles + ripples + reflections ---------- */
const puddles=[];
function puddle(x,z,sx,sz,op=0.8){
  const g=new THREE.CircleGeometry(1,26);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x18244a,roughness:0.05,metalness:0.95,transparent:true,opacity:op}));
  m.rotation.x=-Math.PI/2;m.scale.set(sx,sz,1);m.position.set(x,0.16,z);m.receiveShadow=true;scene.add(m);
  puddles.push(m);
  // neon streak inside
  const streakTex=canvasTex(128,128,(g2)=>{
    const gr=g2.createLinearGradient(0,0,128,0);
    gr.addColorStop(0,'rgba(255,150,60,0)');gr.addColorStop(0.5,'rgba(255,180,100,0.9)');gr.addColorStop(1,'rgba(120,180,255,0)');
    g2.fillStyle=gr;g2.fillRect(0,50,128,28);
    const gr2=g2.createLinearGradient(0,0,0,128);
    gr2.addColorStop(0,'rgba(120,200,255,0)');gr2.addColorStop(0.7,'rgba(120,200,255,0.5)');gr2.addColorStop(1,'rgba(120,200,255,0)');
    g2.fillStyle=gr2;g2.fillRect(20,0,88,128);
  });
  const st=new THREE.Mesh(new THREE.PlaneGeometry(sx*1.4,sz*1.0),
    new THREE.MeshBasicMaterial({map:streakTex,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false}));
  st.rotation.x=-Math.PI/2;st.position.set(x,0.175,z);st.rotation.z=Math.random()*0.6-0.3;
  st.userData.isStreak=true;scene.add(st);
  return m;
}

const ripples=[];
function rippleRing(x,y,z,maxR=0.6,color=0xbfd4ff){
  const m=new THREE.Mesh(new THREE.RingGeometry(0.85,1,24),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.5,side:THREE.DoubleSide,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.scale.setScalar(0.08);
  m.userData={t:Math.random(),maxR,speed:0.5+Math.random()*0.5};
  scene.add(m);ripples.push(m);return m;
}
// seed ripples on puddles + roads

  const px=-8+Math.random()*16, pz= i%2? 2.5+Math.random()*3.2 : -1+Math.random()*2.5;
  if(px>4.5&&px<9.2) continue;
  rippleRing(px,0.17,pz,0.25+Math.random()*0.45);
}
puddles.forEach(p=>{ rippleRing(p.position.x,0.185,p.position.z,0.9); rippleRing(p.position.x+0.3,0.185,p.position.z+0.2,0.6); });

/* ---------- light pools (fake bounce) ---------- */
function lightPool(x,z,color,rx,rz,op=0.35){
  const tex=canvasTex(128,128,(g)=>{
    const gr=g.createRadialGradient(64,64,4,64,64,62);
    gr.addColorStop(0,color);gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect(0,0,128,128);
  });
  const m=new THREE.Mesh(new THREE.PlaneGeometry(rx,rz),
    new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.set(x,0.165,z);m.userData.isPool=true;scene.add(m);return m;
}

    const x=x1+dx*i/n,z=z1+dz*i/n;
    CYL(0.05,0.05,0.7,0xe8ecf7,{x,y:0.5,z,outline:false});
    if(i%2===0) CYL(0.055,0.055,0.12,0xff4a4a,{x,y:0.65,z,outline:false});
  }
  const a=new THREE.Vector3(x1,0.75,z1),b=new THREE.Vector3(x2,0.75,z2);
  tube(a,b,0.045,0xe8ecf7);
  tube(new THREE.Vector3(x1,0.45,z1),new THREE.Vector3(x2,0.45,z2),0.03,0xe8ecf7);
}

BOX(0.9,0.6,0.5,0xaab2cc,{x:-6.6,y:1.08,z:-5.6});
{
  const fan=canvasTex(128,128,(g)=>{g.fillStyle='#6a7390';g.fillRect(0,0,128,128);g.strokeStyle='#2a304a';g.lineWidth=8;g.beginPath();g.arc(64,64,44,0,7);g.stroke();for(let i=0;i<3;i++){g.save();g.translate(64,64);g.rotate(i*2.1);g.fillStyle='#2a304a';g.fillRect(-6,-40,12,36);g.restore();}});
  [0.48,1.08].forEach(y=>{
    const f=new THREE.Mesh(new THREE.PlaneGeometry(0.45,0.45),new THREE.MeshBasicMaterial({map:fan}));
    f.position.set(-6.14, y, -5.6);f.rotation.y=Math.PI/2;scene.add(f);
  });
  tube(new THREE.Vector3(-6.6,1.4,-5.6),new THREE.Vector3(-6.6,3.2,-5.6),0.04,0x8a92ae);
}
// bulletin board / poster wall
{
  BOX(1.6,1.4,0.1,0x6a4a2a,{x:-7.0,y:1.15,z:0.6,outline:false});
  BOX(1.7,0.12,0.25,0x4a3220,{x:-7.0,y:1.95,z:0.6});
  const cols=['#ff8ac8','#7dd8ff','#fff06a','#e8ecf7'];
  for(let i=0;i<4;i++){
    const pt=canvasTex(64,88,(g)=>{g.fillStyle=cols[i];g.fillRect(0,0,64,88);g.fillStyle='#222';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText('LIVE',32,40);g.fillText('7/'+(10+i),32,58);});
    const m=new THREE.Mesh(new THREE.PlaneGeometry(0.32,0.44),new THREE.MeshBasicMaterial({map:pt}));
    m.position.set(-7.45+i*0.32,1.2,0.66);m.rotation.y=0.1*(i-1.5);scene.add(m);
  }
  CYL(0.05,0.05,1.1,0x4a3220,{x:-7.7,y:0.55,z:0.6,outline:false});
  CYL(0.05,0.05,1.1,0x4a3220,{x:-6.3,y:0.55,z:0.6,outline:false});
}
// traffic signal (distant corner, changes)
const sigRMat=new THREE.MeshBasicMaterial({color:0xff2a2a}); sigRMat.toneMapped=false;
const sigGMat=new THREE.MeshBasicMaterial({color:0x1a3a2a});
{
  CYL(0.07,0.09,3.0,0x2f3652,{x:9.0,y:1.5,z:6.0});
  BOX(0.35,0.8,0.35,0x1a1e30,{x:9.0,y:3.2,z:6.0,outline:false});
  const r=new THREE.Mesh(new THREE.SphereGeometry(0.11,12,10),sigRMat);r.position.set(9.0,3.38,6.2);scene.add(r);
  const g=new THREE.Mesh(new THREE.SphereGeometry(0.11,12,10),sigGMat);g.position.set(9.0,3.02,6.2);scene.add(g);
  const gl=glowSprite('rgba(255,60,60,0.8)',1.6,0.5);gl.position.set(9.0,3.38,6.25);scene.add(gl);
  gl.userData.isSigGlow=true;scene.userData.sigGlow=gl;
}

/* ---------- rain on glass streaks ---------- */
const glassDrops=[];
{
  const dg=canvasTex(16,64,(g)=>{const gr=g.createLinearGradient(0,0,0,64);gr.addColorStop(0,'rgba(200,230,255,0)');gr.addColorStop(0.5,'rgba(200,230,255,0.9)');gr.addColorStop(1,'rgba(200,230,255,0)');g.fillStyle=gr;g.fillRect(6,0,4,64);});
  for(let i=0;i<36;i++){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(0.05,0.28),
      new THREE.MeshBasicMaterial({map:dg,transparent:true,opacity:0.5+Math.random()*0.4,depthWrite:false}));
    m.position.set(-5+Math.random()*8, 0.6+Math.random()*2.2, -0.42);
    m.userData={v:0.6+Math.random()*1.2};store.add(m);glassDrops.push(m);
  }
}

/* ---------- eaves drips ---------- */
const drips=[];
for(let i=0;i<10;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,8),
    new THREE.MeshBasicMaterial({color:0x9fc4ff,transparent:true,opacity:0.85}));
  m.position.set(-5+Math.random()*8, 2.9, 0.95);
  m.userData={t:Math.random()*2, speed:5+Math.random()*2};scene.add(m);drips.push(m);
}

/* ---------- rain particles ---------- */
const RAIN_N=2600;
const rainPos=new Float32Array(RAIN_N*3);
const rainVel=new Float32Array(RAIN_N);
for(let i=0;i<RAIN_N;i++){
  rainPos[i*3]=(Math.random()-0.5)*28;
  rainPos[i*3+1]=Math.random()*16;
  rainPos[i*3+2]=(Math.random()-0.5)*28;
  rainVel[i]=13+Math.random()*9;
}
const rainGeo=new THREE.BufferGeometry();
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rainTex=canvasTex(16,64,(g)=>{const gr=g.createLinearGradient(0,0,0,64);gr.addColorStop(0,'rgba(160,190,255,0)');gr.addColorStop(0.5,'rgba(180,210,255,0.95)');gr.addColorStop(1,'rgba(160,190,255,0)');g.fillStyle=gr;g.fillRect(7,0,2,64);});
const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({size:0.55,map:rainTex,transparent:true,opacity:0.65,color:0xaac4ff,depthWrite:false,blending:THREE.AdditiveBlending}));
scene.add(rain);
// faint second layer slanted
const rain2=rain.clone();rain2.material=rain.material.clone();rain2.material.opacity=0.3;rain2.material.size=0.9;scene.add(rain2);

/* ---------- sky glow / moon ---------- */
{
  const moonS=glowSprite('rgba(180,200,255,0.9)',10,0.5);moonS.position.set(-14,15,-14);scene.add(moonS);
  const halo=glowSprite('rgba(255,150,80,0.35)',26,0.25);halo.position.set(0,4,0);scene.add(halo);
}

/* ---------- animation ---------- */
const clock=new THREE.Clock();
let doorT=0, sigT=0, flickT=0;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  // rain
  const p=rainGeo.attributes.position.array;
  for(let i=0;i<RAIN_N;i++){
    p[i*3+1]-=rainVel[i]*dt;
    p[i*3]+=dt*1.2; // wind
    if(p[i*3+1]<0){p[i*3+1]=15+Math.random()*2;p[i*3]=(Math.random()-0.5)*28;p[i*3+2]=(Math.random()-0.5)*28;}
  }
  rainGeo.attributes.position.needsUpdate=true;
  rain2.rotation.y=Math.sin(t*0.1)*0.02;

  // ripples
  for(const r of ripples){
    r.userData.t+=dt*r.userData.speed;
    if(r.userData.t>1) r.userData.t=0;
    const k=r.userData.t;
    r.scale.setScalar(0.08+k*r.userData.maxR);
    r.material.opacity=0.55*(1-k);
  }
  // streak shimmer
  scene.traverse(o=>{});
  for(const s of scene.children){
    if(s.userData && s.userData.isStreak) s.material.opacity=0.4+0.25*Math.sin(t*3+s.position.x*2);
    if(s.userData && s.userData.isPool) s.material.opacity=0.3+0.08*Math.sin(t*2.2+s.position.x);
    if(s.userData && s.userData.isSheen) s.material.opacity=0.1+0.05*Math.sin(t*1.7);
  }

  // sign flicker (subtle neon)
  flickT+=dt;
  let fl=1;
  if(Math.random()<0.025) fl=0.55+Math.random()*0.3;
  else if(Math.random()<0.06) fl=0.85;
  signMat.color.setScalar(fl);
  signGlow.material.opacity=0.32+0.12*Math.sin(t*7)*0.3+(fl<0.9?-0.15:0.08);
  signLight.intensity=10*fl+2*Math.sin(t*13)*0.4;

  // lantern flicker
  const lan=scene.userData.lantern;
  if(lan) lan.scale.setScalar(1+Math.sin(t*9)*0.04+Math.sin(t*23)*0.02);

  // auto door cycle 10s
  doorT+=dt;
  const cyc=doorT%10;
  let open=0;
  if(cyc<5) open=0;
  else if(cyc<6) open=(cyc-5);
  else if(cyc<8) open=1;
  else if(cyc<9) open=1-(cyc-8);
  else open=0;
  const e=open*open*(3-2*open);
  doorL.position.x=-2.05-e*0.85;
  doorR.position.x=-1.05+e*0.85;
  doorLampMat.color.setHex(open>0.02?0x33ff88:0xff4444);
  // spill warm light when open
  warmIn2.intensity=16+e*10;

  // traffic signal
  sigT+=dt;
  const sc=sigT%9;
  if(sc<4){ sigGMat.color.setHex(0x2aff7a); sigRMat.color.setHex(0x3a1414); scene.userData.sigGlow.material.color.set(0x2aff7a); scene.userData.sigGlow.position.set(9.0,3.02,6.25);}
  else if(sc<5){ sigGMat.color.setHex(0x3a3a1a); sigRMat.color.setHex(0xffaa2a); scene.userData.sigGlow.material.color.set(0xffaa2a); scene.userData.sigGlow.position.set(9.0,3.2,6.25);}
  else { sigGMat.color.setHex(0x1a3a2a); sigRMat.color.setHex(0xff2a2a); scene.userData.sigGlow.material.color.set(0xff4444); scene.userData.sigGlow.position.set(9.0,3.38,6.25);}

  // eaves drips
  for(const d of drips){
    d.userData.t+=dt*d.userData.speed*0.5;
    const k=d.userData.t%1;
    d.position.y=2.95-k*2.8;
    d.material.opacity=0.9*(1-k*0.4);
    d.scale.setScalar(0.7+k*0.6);
    if(k>0.97){ d.userData.t=0; d.position.x=-5+Math.random()*8; }
  }
  // glass drops slide
  for(const gd of glassDrops){
    gd.position.y-=gd.userData.v*dt;
    if(gd.position.y<0.4){gd.position.y=2.6+Math.random()*0.3;gd.position.x=-5+Math.random()*8;}
  }
  // oden steam
  for(const s of steams){
    s.userData.t+=dt*0.5;
    if(s.userData.t>1)s.userData.t=0;
    const k=s.userData.t;
    s.position.y=1.45+k*0.9;
    s.position.x+=Math.sin(t*2+k*6)*0.0015;
    s.material.opacity=0.28*(1-k);
    s.scale.setScalar(0.3+k*0.6);
  }
  // ceiling warm subtle breathing
  warmIn1.intensity=26+Math.sin(t*1.3)*0.8;

  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
