{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SKY = 0x101a30;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 70, 150);

const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.5, 300);
camera.position.set(21, 23, 26);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 14;
controls.maxDistance = 80;
controls.maxPolarAngle = Math.PI * 0.47;
controls.update();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let rs = 711;
const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const smooth = (x) => x * x * (3 - 2 * x);
const root = new THREE.Group();
scene.add(root);

const gradTex = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
gradTex.minFilter = gradTex.magFilter = THREE.NearestFilter;
gradTex.generateMipmaps = false;
gradTex.needsUpdate = true;

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat[0], repeat[1]);
  }
  return t;
}

const glowCache = new Map();
function glowTexFor(rgb) {
  if (!glowCache.has(rgb)) {
    glowCache.set(rgb, canvasTex(128, 128, (g) => {
      const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grd.addColorStop(0, `rgba(${rgb},1)`);
      grd.addColorStop(0.3, `rgba(${rgb},0.4)`);
      grd.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = grd;
      g.fillRect(0, 0, 128, 128);
    }));
  }
  return glowCache.get(rgb);
}

function glow(rgb, w, h, x, y, z, opacity = 1, parent = root) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexFor(rgb), transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  s.scale.set(w, h, 1);
  s.position.set(x, y, z);
  parent.add(s);
  return s;
}

function glowFlat(rgb, w, d, x, z, opacity, parent = root) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({
    map: glowTexFor(rgb), transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.05, z);
  parent.add(m);
  return m;
}

function toon(color, o = {}) {
  const op = o.opacity ?? 1;
  return new THREE.MeshToonMaterial({
    color,
    gradientMap: gradTex,
    map: o.map ?? null,
    emissive: o.emissive ?? 0x000000,
    emissiveIntensity: o.ei ?? 1,
    emissiveMap: o.emissiveMap ?? null,
    transparent: op < 1,
    opacity: op,
    depthWrite: op >= 1,
    side: o.side ?? THREE.FrontSide,
  });
}

const outlineCache = new Map();
function outlineMat(t) {
  const k = t.toFixed(4);
  if (!outlineCache.has(k)) {
    outlineCache.set(k, new THREE.ShaderMaterial({
      uniforms: { thick: { value: t } },
      vertexShader: 'uniform float thick; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * thick, 1.0); }',
      fragmentShader: 'void main(){ gl_FragColor = vec4(0.06, 0.07, 0.12, 1.0); }',
      side: THREE.BackSide,
    }));
  }
  return outlineCache.get(k);
}

function finish(m, p, parent, th) {
  m.castShadow = p.cast ?? true;
  m.receiveShadow = true;
  const t = p.ol ?? th;
  if (t > 0 && !p.opacity) {
    const o = new THREE.Mesh(m.geometry, outlineMat(t));
    o.castShadow = false;
    o.receiveShadow = false;
    m.add(o);
  }
  parent.add(m);
  return m;
}

function B(w, h, d, x, y, z, color, p = {}, parent = root) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toon(color, p));
  m.position.set(x, y, z);
  return finish(m, p, parent, Math.min(0.025, Math.min(w, h, d) * 0.2));
}

function C(rt, rb, h, x, y, z, color, p = {}, parent = root) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 16), toon(color, p));
  m.position.set(x, y, z);
  return finish(m, p, parent, Math.min(0.02, Math.max(rt, rb) * 0.25));
}

function S(r, x, y, z, color, p = {}, parent = root) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), toon(color, p));
  m.position.set(x, y, z);
  return finish(m, p, parent, Math.min(0.02, r * 0.25));
}

function F(w, d, x, y, z, color, p = {}, parent = root) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), toon(color, p));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function P(w, h, x, y, z, color, p = {}, parent = root) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), toon(color, p));
  m.position.set(x, y, z);
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

const glassMat = new THREE.MeshToonMaterial({
  color: 0xbfe9ff, gradientMap: gradTex, transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide,
});
function glass(w, h, x, y, z, parent = root) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glassMat);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}

function bar(a, b, r, color, p = {}, parent = root) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), toon(color, p));
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), dir.normalize());
  return finish(m, { ol: 0, ...p }, parent, 0);
}

const wireMat = toon(0x161a24);
function wire(a, b, sag) {
  const mid = a.clone().lerp(b, 0.5);
  mid.y -= sag;
  const curve = new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone());
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.018, 5, false), wireMat);
  m.castShadow = false;
  root.add(m);
}

const boxUnit = new THREE.BoxGeometry(1, 1, 1);
function instBoxes(list, parent = root) {
  if (!list.length) return;
  const im = new THREE.InstancedMesh(boxUnit, toon(0xffffff), list.length);
  const m = new THREE.Matrix4();
  const c = new THREE.Color();
  list.forEach((b, i) => {
    m.makeScale(b.w, b.h, b.d);
    m.setPosition(b.x, b.y, b.z);
    im.setMatrixAt(i, m);
    im.setColorAt(i, c.set(b.c));
  });
  im.instanceMatrix.needsUpdate = true;
  im.instanceColor.needsUpdate = true;
  im.receiveShadow = true;
  parent.add(im);
}

function stock(list, x0, x1, zc, zd, y, pal, hMin, hMax, wMin, wMax) {
  for (let x = x0; ;) {
    const w = wMin + rnd() * (wMax - wMin);
    if (x + w > x1) break;
    const h = hMin + rnd() * (hMax - hMin);
    const d = zd * (0.7 + rnd() * 0.3);
    list.push({
      x: x + w / 2, y: y + h / 2, z: zc + (rnd() - 0.5) * (zd - d) * 0.6,
      w, h, d, c: pal[(rnd() * pal.length) | 0],
    });
    x += w + 0.012;
  }
  return list;
}

const DRINK = [0xe8453c, 0x3c7fe8, 0x39b56a, 0xf2c230, 0xf5f5f5, 0x7a4cc8, 0x20a4a8, 0xff8a3d];
const SNACK = [0xf7c948, 0xe05a47, 0x4f8fd6, 0xf4e1c1, 0x8fc66a, 0xc85ea5, 0x2f8f86];
const FOOD = [0xf7f4ec, 0xf2d6a2, 0xe25b45, 0xffe3a8, 0x9cd3a2, 0xfafafa];
const ODEN = [0xd9913c, 0xf2d26b, 0x9e5a2b, 0xf7e7c0, 0xc86a2a];

function labelTex(text, bg, fg, w = 512, h = 256, size = 80) {
  return canvasTex(w, h, (g) => {
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
    g.strokeStyle = '#ffffff';
    g.lineWidth = 10;
    g.strokeRect(12, 12, w - 24, h - 24);
    g.fillStyle = fg;
    g.font = `bold ${size}px "Yu Gothic","Meiryo",sans-serif`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, w / 2, h / 2 + 4);
  });
}

const puddles = [];
function puddle(x, z, rx, rz) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(1, 28), new THREE.MeshToonMaterial({
    color: 0x27395a, gradientMap: gradTex, transparent: true, opacity: 0.8, depthWrite: false,
  }));
  m.rotation.x = -Math.PI / 2;
  m.scale.set(rx, rz, 1);
  m.position.set(x, 0.04, z);
  root.add(m);
  puddles.push({ x, z, rx, rz });
}

/* ---------- 光照 ---------- */
scene.add(new THREE.HemisphereLight(0x7f94c8, 0x1b1f2e, 0.9));
const moon = new THREE.DirectionalLight(0xa9c0ff, 1.1);
moon.position.set(-14, 26, 10);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 1, far: 70 });
moon.shadow.camera.updateProjectionMatrix();
moon.shadow.bias = -0.0006;
moon.shadow.normalBias = 0.03;
scene.add(moon);

function pointLight(color, intensity, distance, x, y, z) {
  const l = new THREE.PointLight(color, intensity, distance, 2);
  l.position.set(x, y, z);
  scene.add(l);
}
pointLight(0xffd9a0, 14, 12, -4.4, 3.8, -4.2);
pointLight(0xffd9a0, 14, 12, -0.6, 3.8, -4.0);
pointLight(0xffd9a0, 10, 10, 1.2, 3.6, -1.6);
pointLight(0xffcf8f, 6, 7, -2.0, 2.2, 1.6);
pointLight(0xffe6b0, 22, 12, -11.4, 4.8, 4.3);

/* ---------- 底座与地面 ---------- */
B(24.8, 0.2, 24.8, 0, -1.1, 0, 0x1a1f2c, { ol: 0 });
B(24, 1, 24, 0, -0.5, 0, 0x2c3242);

const concrete = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#8e97a8';
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    g.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';
    g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 3, 2 + rnd() * 3);
  }
  g.fillStyle = '#6b7487';
  g.fillRect(0, 0, w, 3);
  g.fillRect(0, 0, 3, h);
  g.fillRect(w / 2, 0, 3, h);
  g.fillRect(0, h / 2, w, 3);
}, [12, 12]);
F(24, 24, 0, 0.01, 0, 0xffffff, { map: concrete });

const asphalt = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3a4152';
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 700; i++) {
    g.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.12)';
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2);
  }
}, [6, 2]);
F(24, 8, 0, 0.02, 8, 0xffffff, { map: asphalt });

B(1.5, 0.25, 0.3, -11.25, 0.125, 4.0, 0xd0d4de);
B(18.5, 0.25, 0.3, 2.75, 0.125, 4.0, 0xd0d4de);

for (let i = 0; i < 4; i++) B(0.5, 0.012, 7.2, -10.1 + i * 1.0, 0.04, 8.0, 0xf2f5fa, { ol: 0 });
glowFlat('210,235,255', 4.4, 7.4, -8.6, 8, 0.22);
for (let x = -4; x <= 5; x += 2.6) B(1.3, 0.012, 0.14, x, 0.04, 7.2, 0xe8ebf2, { ol: 0 });
B(5.2, 0.012, 0.12, 8.5, 0.04, 9.4, 0xe8ebf2, { ol: 0 });
B(0.12, 0.012, 2.6, 6.0, 0.04, 10.7, 0xe8ebf2, { ol: 0 });
B(0.12, 0.012, 2.6, 11.0, 0.04, 10.7, 0xe8ebf2, { ol: 0 });
C(0.5, 0.5, 0.02, 2.0, 0.03, 8.3, 0x2a2f3c, { ol: 0 });

B(1.6, 0.02, 0.24, -2.2, 0.035, 3.7, 0x2b303c, { ol: 0 });
const slats = [];
for (let i = 0; i < 9; i++) slats.push({ x: -2.2 + (i - 4) * 0.16, y: 0.06, z: 3.7, w: 0.05, h: 0.02, d: 0.22, c: 0x9aa3b3 });
instBoxes(slats);

puddle(-3.6, 1.7, 1.3, 0.55);
puddle(4.2, 1.6, 0.9, 0.5);
puddle(4.6, -2.0, 0.8, 1.6);
puddle(-4.2, 7.4, 2.2, 1.0);
puddle(5.0, 6.2, 1.2, 0.8);
glowFlat('255,190,120', 3.2, 1.2, -3.2, 1.7, 0.5);
glowFlat('255,110,180', 1.2, 2.0, 4.6, -1.5, 0.3);
glowFlat('255,230,180', 2.4, 1.6, -4.2, 7.4, 0.35);

/* ---------- 便利店外观 ---------- */
const WALL = 0xeee8dc, DARK = 0x3a4150, TEAL = 0x2f8f86, H = 4.5;

B(10.6, H, 0.3, -2.0, H / 2, -6.15, WALL);
B(0.3, H, 6.8, -7.15, H / 2, -2.9, WALL);

const signTex = labelTex('よるのマート', '#1f7f72', '#fff6d6', 1024, 160, 96);
B(9.4, 1.0, 0.12, -2.0, 3.85, 0.66, 0x17423e);
const sign = P(9.2, 0.9, -2.0, 3.85, 0.73, 0xffffff, { map: signTex, emissiveMap: signTex, emissive: 0xffffff, ei: 0.7 });

glass(8, 2.7, -2.5, 1.85, 0.53);

B(8, 0.08, 0.1, -2.5, 0.5, 0.55, DARK);

const hl1 = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 2.9), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.09, depthWrite: false }));
hl1.position.set(-4.4, 1.85, 0.54);
hl1.rotation.z = -0.35;
root.add(hl1);
const hl2 = hl1.clone();
hl2.position.set(-2.0, 1.85, 0.54);

const doorL = new THREE.Group();

doorR.position.set(-0.5, 0, 0.56);
root.add(doorL, doorR);

glass(0.7, 2.7, 0, 1.85, 0, doorR);

B(0.05, 0.8, 0.05, -0.25, 1.4, 0.04, 0xd8dde6, { ol: 0 }, doorR);

const awnTex = canvasTex(256, 64, (g, w, h) => {
  for (let i = 0; i < 8; i++) {
    g.fillStyle = i % 2 ? '#f4efe2' : '#2f8f86';
    g.fillRect((i * w) / 8, 0, w / 8, h);
  }
}, [2, 1]);
B(10, 0.08, 1.9, -2.0, 3.05, 1.5, 0xffffff, { map: awnTex }).rotation.x = 0.16;
bar(V(-6.8, 0, 2.2), V(-6.8, 2.88, 2.2), 0.04, DARK);
bar(V(2.6, 0, 2.2), V(2.6, 2.88, 2.2), 0.04, DARK);

const checker = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#efe2c4';
  g.fillRect(0, 0, w, h);
  g.fillStyle = '#d6bf92';
  g.fillRect(0, 0, w / 2, h / 2);
  g.fillRect(w / 2, h / 2, w / 2, h / 2);
}, [8.3, 5.4]);

B(1.0, 1.9, 0.5, 2.35, 0.95, -5.6, 0x9aa7bb);

const odenLid = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.3, 0.68), glassMat);
odenLid.position.set(-5.0, 1.0, -1.08);

const odenItems = [];
for (let i = 0; i < 14; i++) {
  odenItems.push({ x: -5.9 + rnd() * 1.8, y: 0.95, z: -1.2 + rnd() * 0.25, w: 0.12, h: 0.1, d: 0.12, c: ODEN[(rnd() * ODEN.length) | 0] });
}

const steam = [];
for (let i = 0; i < 7; i++) steam.push({ s: glow('255,255,255', 0.5, 0.5, 0, 0, 0, 0), ph: i / 7 });

function gondola(x0, x1, z, accent) {
  const cx = (x0 + x1) / 2;
  const w = x1 - x0;
  [0.45, 0.9, 1.35].forEach((y) => B(w, 0.04, 0.5, cx, y, z, 0xf1f3f6));
  B(0.05, 1.6, 0.5, x0, 0.8, z, 0xf1f3f6);
  B(0.05, 1.6, 0.5, x1, 0.8, z, 0xf1f3f6);
  B(w, 0.12, 0.52, cx, 1.66, z, accent);
  const list = [];

/* ---------- 雨、积水、水滴 ---------- */
const RAIN = 1600, RAIN_TOP = 15;
const rainPos = new Float32Array(RAIN * 6);
const rainSpd = new Float32Array(RAIN);
function resetDrop(i, y0) {
  const x = (rnd() - 0.5) * 24;
  const z = (rnd() - 0.5) * 24;
  const y = y0 ?? RAIN_TOP * rnd();
  const k = i * 6;
  rainPos[k] = x; rainPos[k + 1] = y; rainPos[k + 2] = z;
  rainPos[k + 3] = x - 0.12; rainPos[k + 4] = y - 0.7; rainPos[k + 5] = z;
  rainSpd[i] = 14 + rnd() * 6;
}
for (let i = 0; i < RAIN; i++) resetDrop(i);
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({
  color: 0xbcd6ff, transparent: true, opacity: 0.32, depthWrite: false,
}));
rain.frustumCulled = false;
root.add(rain);

function updateRain(dt) {
  for (let i = 0; i < RAIN; i++) {
    const k = i * 6;
    const y = rainPos[k + 1] - rainSpd[i] * dt;
    if (y < 0) { resetDrop(i, RAIN_TOP); continue; }
    rainPos[k + 1] = y;
    rainPos[k + 4] = y - 0.7;
  }
  rainGeo.attributes.position.needsUpdate = true;
}

const ripples = [];
for (let i = 0; i < 48; i++) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 28), new THREE.MeshBasicMaterial({
    color: 0xc4e8ff, transparent: true, opacity: 0, depthWrite: false,
  }));
  m.rotation.x = -Math.PI / 2;
  m.visible = false;
  root.add(m);
  ripples.push({ m, age: 0, life: 1, max: 0.6, s: 1 });
}
let ripIdx = 0;
function spawnRipple(x, z, scale = 1) {
  const r = ripples[ripIdx];
  ripIdx = (ripIdx + 1) % ripples.length;
  r.m.position.set(x, 0.05, z);
  r.age = 0;
  r.life = 0.8 + rnd() * 0.4;
  r.s = scale;
  r.m.visible = true;
}
function updateRipples(dt) {
  for (const r of ripples) {
    if (!r.m.visible) continue;
    r.age += dt;
    const p = r.age / r.life;
    if (p >= 1) { r.m.visible = false; continue; }
    r.m.scale.setScalar(0.1 + p * 0.9 * r.s);
    r.m.material.opacity = (1 - p) * r.max;
  }
}
function randomWet() {
  if (rnd() < 0.6) {
    const p = puddles[(rnd() * puddles.length) | 0];
    const a = rnd() * Math.PI * 2;
    const r = Math.sqrt(rnd());
    return [p.x + Math.cos(a) * r * p.rx, p.z + Math.sin(a) * r * p.rz];
  }
  return [(rnd() - 0.5) * 22, 0.8 + rnd() * 10.7];
}

const drips = [];
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), new THREE.MeshBasicMaterial({
    color: 0xd6efff, transparent: true, opacity: 0.85,
  }));
  m.scale.y = 1.8;
  m.visible = false;
  root.add(m);
  drips.push({ m, t: 0, on: false, x: 0 });
}
let dripTimer = 0;
function updateDrips(dt) {
  dripTimer -= dt;
  if (dripTimer <= 0) {
    dripTimer = 0.45 + rnd() * 0.5;
    const d = drips.find((q) => !q.on);
    if (d) {
      d.on = true;
      d.t = 0;
      d.x = -6.4 + rnd() * 9;
      d.m.position.set(d.x, 2.95, 2.55);
      d.m.visible = true;
    }
  }
  for (const d of drips) {
    if (!d.on) continue;
    d.t += dt;
    const y = 2.95 - 0.5 * 9.8 * d.t * d.t;
    if (y <= 0.05) {
      d.on = false;
      d.m.visible = false;
      spawnRipple(d.x, 2.55, 0.5);
    } else {
      d.m.position.y = y;
    }
  }
}

const streaks = [];
for (let i = 0; i < 14; i++) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.28, 0.01), new THREE.MeshBasicMaterial({
    color: 0xe6f6ff, transparent: true, opacity: 0.45,
  }));
  const s = { m, x: -6.2 + rnd() * 7.6, ph: rnd() * 2.6, sp: 0.18 + rnd() * 0.25 };
  m.position.set(s.x, 2, 0.57);
  root.add(m);
  streaks.push(s);
}

function doorAmount(t) {
  const c = t % 14;
  if (c < 6) return 0;
  if (c < 7) return smooth(c - 6);
  if (c < 9) return 1;
  if (c < 10) return 1 - smooth(c - 9);
  return 0;
}

const lampLitColors = lampLit;
const pinkBase = 0.9;

/* ---------- 循环 ---------- */
const clock = new THREE.Clock();
let rippleTimer = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  updateRain(dt);
  rippleTimer -= dt;
  if (rippleTimer <= 0) {
    rippleTimer = 0.06 + rnd() * 0.08;
    const [x, z] = randomWet();
    spawnRipple(x, z, 0.8 + rnd() * 0.5);
  }
  updateRipples(dt);
  updateDrips(dt);

  const door = doorAmount(t);
  doorL.position.x = -1.2 - 0.6 * door;
  doorR.position.x = -0.5 + 0.6 * door;

  const flick = Math.sin(t * 2.1) > 0.985 || Math.sin(t * 5.3 + 1) > 0.99 ? 0.4 : 1;
  sign.material.emissiveIntensity = 0.7 * flick;
  vendGlows.forEach((g, i) => { g.material.opacity = 0.35 + 0.1 * Math.sin(t * 1.7 + i); });

  neonPink.material.emissiveIntensity = pinkBase + 0.2 * Math.sin(t * 9);
  neonCyan.material.emissiveIntensity = 1.0 + 0.1 * Math.sin(t * 6.3);

  const phase = t % 12;
  const state = phase < 5 ? 2 : phase < 6.5 ? 1 : 0;
  lampMats.forEach((mt, i) => {
    const on = i === state;
    mt.color.setHex(on ? lampLitColors[i] : lampDim[i]);
    lampGlows[i].material.opacity = on ? 0.9 : 0;
    lampGlows[i].material.color.setHex(lampLitColors[i]);
  });

  for (const s of streaks) {
    s.m.position.y = 3.1 - ((t * s.sp + s.ph) % 2.6) - 0.14;
  }

  for (const s of steam) {
    const p = (t * 0.22 + s.ph) % 1;
    s.s.position.set(-5.0 + Math.sin(p * 6 + s.ph * 10) * 0.25, 1.05 + p * 1.2, -1.1);
    s.s.scale.setScalar(0.3 + p * 0.6);
    s.s.material.opacity = 0.35 * Math.sin(p * Math.PI);
  }

  fanGroup.rotation.x += dt * 6;

  controls.update();
  renderer.render(scene, camera);
});
