<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨夜便利店街角</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(to bottom, #0a0e1a 0%, #1a1f35 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            text-align: center;
            z-index: 1000;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">加载中...</div>
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 场景初始化
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x0a0e1a, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById('canvas'),
            antialias: true,
            alpha: false
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        // 鼠标控制
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let distance = 25;
        let targetDistance = 25;

        // 创建底座
        function createBase() {
            const baseGeometry = new THREE.BoxGeometry(20, 0.5, 20);
            const baseMaterial = new THREE.MeshStandardMaterial({
                color: 0x2a2a2a,
                roughness: 0.8,
                metalness: 0.2
            });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = -0.25;
            base.receiveShadow = true;
            scene.add(base);

            // 底座边缘
            const edgeGeometry = new THREE.BoxGeometry(20.2, 0.3, 0.3);
            const edgeMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });

            for (let i = 0; i < 4; i++) {
                const edge = new THREE.Mesh(i % 2 === 0 ? edgeGeometry : new THREE.BoxGeometry(0.3, 0.3, 20.2), edgeMaterial);
                edge.position.y = -0.4;
                if (i === 0) edge.position.z = 10;
                if (i === 1) edge.position.x = 10;
                if (i === 2) edge.position.z = -10;
                if (i === 3) edge.position.x = -10;
                scene.add(edge);
            }
        }

        // 创建地面（湿润路面）
        function createGround() {
            const groundGeometry = new THREE.PlaneGeometry(19, 19);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a1a,
                roughness: 0.3,
                metalness: 0.6
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0.01;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        // 创建便利店主建筑
        function createConvenienceStore() {
            const storeGroup = new THREE.Group();

            // 主体建筑
            const wallGeometry = new THREE.BoxGeometry(8, 5, 6);
            const wallMaterial = new THREE.MeshToonMaterial({ color: 0xe8e8e8 });
            const walls = new THREE.Mesh(wallGeometry, wallMaterial);
            walls.position.y = 2.5;
            walls.castShadow = true;
            walls.receiveShadow = true;
            storeGroup.add(walls);

            // 屋顶
            const roofGeometry = new THREE.BoxGeometry(8.5, 0.3, 6.5);
            const roofMaterial = new THREE.MeshToonMaterial({ color: 0x4a4a4a });
            const roof = new THREE.Mesh(roofGeometry, roofMaterial);
            roof.position.y = 5.15;
            roof.castShadow = true;
            storeGroup.add(roof);

            // 大玻璃窗（正面）
            const windowGeometry = new THREE.BoxGeometry(6, 3.5, 0.1);
            const windowMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x88ccff,
                transparent: true,
                opacity: 0.3,
                metalness: 0.1,
                roughness: 0.1,
                transmission: 0.9
            });
            const frontWindow = new THREE.Mesh(windowGeometry, windowMaterial);
            frontWindow.position.set(0, 2.5, 3.05);
            storeGroup.add(frontWindow);

            // 侧面玻璃窗
            const sideWindowGeometry = new THREE.BoxGeometry(0.1, 3.5, 4);
            const sideWindow = new THREE.Mesh(sideWindowGeometry, windowMaterial);
            sideWindow.position.set(4.05, 2.5, 0);
            storeGroup.add(sideWindow);

            // 自动门
            const doorGeometry = new THREE.BoxGeometry(1.8, 3.2, 0.15);
            const doorMaterial = new THREE.MeshToonMaterial({
                color: 0xcccccc,
                transparent: true,
                opacity: 0.7
            });
            const door = new THREE.Mesh(doorGeometry, doorMaterial);
            door.position.set(-2.5, 1.8, 3.1);
            storeGroup.add(door);

            // 门框
            const doorFrameGeometry = new THREE.BoxGeometry(2, 3.4, 0.2);
            const doorFrameMaterial = new THREE.MeshToonMaterial({ color: 0x666666 });
            const doorFrame = new THREE.Mesh(doorFrameGeometry, doorFrameMaterial);
            doorFrame.position.set(-2.5, 1.8, 3.15);
            storeGroup.add(doorFrame);

            // 招牌
            const signGeometry = new THREE.BoxGeometry(7, 1.2, 0.3);
            const signMaterial = new THREE.MeshToonMaterial({ color: 0x2196F3, emissive: 0x2196F3, emissiveIntensity: 0.5 });
            const sign = new THREE.Mesh(signGeometry, signMaterial);
            sign.position.set(0, 5.8, 3.2);
            storeGroup.add(sign);

            // 招牌文字（简化为白色条）
            const textGeometry = new THREE.BoxGeometry(5, 0.6, 0.05);
            const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const text = new THREE.Mesh(textGeometry, textMaterial);
            text.position.set(0, 5.8, 3.36);
            storeGroup.add(text);

            // 雨棚
            const awningGeometry = new THREE.BoxGeometry(8.5, 0.1, 2);
            const awningMaterial = new THREE.MeshToonMaterial({ color: 0xf5f5f5, transparent: true, opacity: 0.8 });
            const awning = new THREE.Mesh(awningGeometry, awningMaterial);
            awning.position.set(0, 4.2, 4.2);
            awning.rotation.x = -0.2;
            storeGroup.add(awning);

            // 店内灯光
            const interiorLight1 = new THREE.PointLight(0xfff8e1, 2, 12);
            interiorLight1.position.set(0, 4, 0);
            interiorLight1.castShadow = true;
            storeGroup.add(interiorLight1);

            const interiorLight2 = new THREE.PointLight(0xfff8e1, 1.5, 10);
            interiorLight2.position.set(2, 3, 1);
            storeGroup.add(interiorLight2);

            const interiorLight3 = new THREE.PointLight(0xfff8e1, 1.5, 10);
            interiorLight3.position.set(-2, 3, -1);
            storeGroup.add(interiorLight3);

            scene.add(storeGroup);
            return storeGroup;
        }

        // 创建店内设施
        function createInteriorItems() {
            const interiorGroup = new THREE.Group();

            // 货架 (多个)
            for (let i = 0; i < 3; i++) {
                const shelfGeometry = new THREE.BoxGeometry(0.5, 2.5, 3);
                const shelfMaterial = new THREE.MeshToonMaterial({ color: 0xd4d4d4 });
                const shelf = new THREE.Mesh(shelfGeometry, shelfMaterial);
                shelf.position.set(-2.5 + i * 2, 1.25, -1);
                interiorGroup.add(shelf);

                // 货架商品（彩色块）
                for (let j = 0; j < 6; j++) {
                    const itemGeometry = new THREE.BoxGeometry(0.3, 0.3, 0.4);
                    const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3, 0xf38181];
                    const itemMaterial = new THREE.MeshToonMaterial({ color: colors[j % colors.length] });
                    const item = new THREE.Mesh(itemGeometry, itemMaterial);
                    item.position.set(-2.5 + i * 2, 0.5 + Math.floor(j / 3) * 0.8, -1.2 + (j % 3) * 0.8);
                    interiorGroup.add(item);
                }
            }

            // 饮料柜
            const fridgeGeometry = new THREE.BoxGeometry(2, 2.8, 0.6);
            const fridgeMaterial = new THREE.MeshToonMaterial({ color: 0xe0e0e0 });
            const fridge = new THREE.Mesh(fridgeGeometry, fridgeMaterial);
            fridge.position.set(2.5, 1.4, 2);
            interiorGroup.add(fridge);

            // 饮料柜玻璃门
            const fridgeGlassGeometry = new THREE.BoxGeometry(1.8, 2.5, 0.1);
            const fridgeGlassMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x88ddff,
                transparent: true,
                opacity: 0.4,
                metalness: 0.1,
                roughness: 0.1
            });
            const fridgeGlass = new THREE.Mesh(fridgeGlassGeometry, fridgeGlassMaterial);
            fridgeGlass.position.set(2.5, 1.4, 2.35);
            interiorGroup.add(fridgeGlass);

            // 收银台
            const counterGeometry = new THREE.BoxGeometry(2, 1.2, 1);
            const counterMaterial = new THREE.MeshToonMaterial({ color: 0xbdbdbd });
            const counter = new THREE.Mesh(counterGeometry, counterMaterial);
            counter.position.set(-2.5, 0.6, 2);
            interiorGroup.add(counter);

            // 收银机
            const registerGeometry = new THREE.BoxGeometry(0.4, 0.3, 0.3);
            const registerMaterial = new THREE.MeshToonMaterial({ color: 0x333333 });
            const register = new THREE.Mesh(registerGeometry, registerMaterial);
            register.position.set(-2.5, 1.3, 2);
            interiorGroup.add(register);

            // 关东煮柜台
            const odenCounterGeometry = new THREE.BoxGeometry(1.5, 1, 0.8);
            const odenCounterMaterial = new THREE.MeshToonMaterial({ color: 0xd4a574 });
            const odenCounter = new THREE.Mesh(odenCounterGeometry, odenCounterMaterial);
            odenCounter.position.set(0, 0.5, 2.3);
            interiorGroup.add(odenCounter);

            scene.add(interiorGroup);
            return interiorGroup;
        }

        // 创建自动售货机
        function createVendingMachine() {
            const vmGroup = new THREE.Group();

            const bodyGeometry = new THREE.BoxGeometry(1.2, 2.5, 0.8);
            const bodyMaterial = new THREE.MeshToonMaterial({ color: 0xe53935 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1.25;
            body.castShadow = true;
            vmGroup.add(body);

            // 显示屏
            const screenGeometry = new THREE.BoxGeometry(1, 1.8, 0.05);
            const screenMaterial = new THREE.MeshBasicMaterial({ color: 0x1a1a1a });
            const screen = new THREE.Mesh(screenGeometry, screenMaterial);
            screen.position.set(0, 1.4, 0.41);
            vmGroup.add(screen);

            // 发光商品展示（彩色格子）
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 3; j++) {
                    const itemGeometry = new THREE.BoxGeometry(0.2, 0.3, 0.03);
                    const colors = [0xff9800, 0x4caf50, 0x2196f3, 0xf44336];
                    const itemMaterial = new THREE.MeshBasicMaterial({ color: colors[(i + j) % colors.length] });
                    const item = new THREE.Mesh(itemGeometry, itemMaterial);
                    item.position.set(-0.35 + i * 0.25, 0.8 + j * 0.4, 0.43);
                    vmGroup.add(item);
                }
            }

            vmGroup.position.set(5, 0, 2);
            scene.add(vmGroup);
            return vmGroup;
        }

        // 创建路灯
        function createStreetLight(x, z) {
            const lightGroup = new THREE.Group();

            // 灯杆
            const poleGeometry = new THREE.CylinderGeometry(0.08, 0.08, 6, 8);
            const poleMaterial = new THREE.MeshToonMaterial({ color: 0x4a4a4a });
            const pole = new THREE.Mesh(poleGeometry, poleMaterial);
            pole.position.y = 3;
            pole.castShadow = true;
            lightGroup.add(pole);

            // 灯罩
            const lampGeometry = new THREE.CylinderGeometry(0.3, 0.4, 0.5, 8);
            const lampMaterial = new THREE.MeshToonMaterial({ color: 0x2a2a2a });
            const lamp = new THREE.Mesh(lampGeometry, lampMaterial);
            lamp.position.y = 6.3;
            lightGroup.add(lamp);

            // 灯光
            const lampLightGeometry = new THREE.CircleGeometry(0.35, 16);
            const lampLightMaterial = new THREE.MeshBasicMaterial({ color: 0xfff8dc });
            const lampLight = new THREE.Mesh(lampLightGeometry, lampLightMaterial);
            lampLight.rotation.x = -Math.PI / 2;
            lampLight.position.y = 6.05;
            lightGroup.add(lampLight);

            const pointLight = new THREE.PointLight(0xfff4d6, 1.5, 15);
            pointLight.position.y = 6;
            pointLight.castShadow = true;
            lightGroup.add(pointLight);

            lightGroup.position.set(x, 0, z);
            scene.add(lightGroup);
            return lightGroup;
        }

        // 创建自行车
        function createBicycle() {
            const bikeGroup = new THREE.Group();

            // 车架
            const frameGeometry = new THREE.BoxGeometry(0.05, 0.8, 1.2);
            const frameMaterial = new THREE.MeshToonMaterial({ color: 0x4a90e2 });
            const frame = new THREE.Mesh(frameGeometry, frameMaterial);
            frame.position.y = 0.6;
            bikeGroup.add(frame);

            // 车轮
            const wheelGeometry = new THREE.TorusGeometry(0.25, 0.05, 8, 16);
            const wheelMaterial = new THREE.MeshToonMaterial({ color: 0x2a2a2a });

            const frontWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            frontWheel.rotation.y = Math.PI / 2;
            frontWheel.position.set(0, 0.25, 0.5);
            bikeGroup.add(frontWheel);

            const backWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            backWheel.rotation.y = Math.PI / 2;
            backWheel.position.set(0, 0.25, -0.5);
            bikeGroup.add(backWheel);

            bikeGroup.position.set(6, 0, -2);
            bikeGroup.rotation.y = Math.PI / 6;
            scene.add(bikeGroup);
            return bikeGroup;
        }

        // 创建雨粒子系统
        function createRain() {
            const rainCount = 3000;
            const rainGeometry = new THREE.BufferGeometry();
            const rainPositions = new Float32Array(rainCount * 3);
            const rainVelocities = [];

            for (let i = 0; i < rainCount; i++) {
                rainPositions[i * 3] = (Math.random() - 0.5) * 50;
                rainPositions[i * 3 + 1] = Math.random() * 30;
                rainPositions[i * 3 + 2] = (Math.random() - 0.5) * 50;
                rainVelocities.push(0.1 + Math.random() * 0.1);
            }

            rainGeometry.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));

            const rainMaterial = new THREE.PointsMaterial({
                color: 0xaaaaaa,
                size: 0.1,
                transparent: true,
                opacity: 0.6
            });

            const rain = new THREE.Points(rainGeometry, rainMaterial);
            scene.add(rain);

            return { rain, velocities: rainVelocities };
        }

        // 创建斑马线
        function createCrosswalk() {
            const stripeCount = 8;
            for (let i = 0; i < stripeCount; i++) {
                const stripeGeometry = new THREE.BoxGeometry(1, 0.02, 0.6);
                const stripeMaterial = new THREE.MeshStandardMaterial({
                    color: 0xeeeeee,
                    roughness: 0.4,
                    metalness: 0.3
                });
                const stripe = new THREE.Mesh(stripeGeometry, stripeMaterial);
                stripe.position.set(-3 + i * 0.8, 0.02, 6);
                scene.add(stripe);
            }
        }

        // 创建小巷入口
        function createAlley() {
            const alleyWallGeometry = new THREE.BoxGeometry(0.3, 4, 6);
            const alleyWallMaterial = new THREE.MeshToonMaterial({ color: 0x6a6a6a });

            const leftWall = new THREE.Mesh(alleyWallGeometry, alleyWallMaterial);
            leftWall.position.set(-6, 2, -5);
            leftWall.castShadow = true;
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(alleyWallGeometry, alleyWallMaterial);
            rightWall.position.set(-9, 2, -5);
            rightWall.castShadow = true;
            scene.add(rightWall);
        }

        // 环境光照
        const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0x7788aa, 0.3);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        mainLight.shadow.camera.left = -20;
        mainLight.shadow.camera.right = 20;
        mainLight.shadow.camera.top = 20;
        mainLight.shadow.camera.bottom = -20;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        // 创建所有场景元素
        createBase();
        createGround();
        const store = createConvenienceStore();
        createInteriorItems();
        createVendingMachine();
        createStreetLight(7, 6);
        createStreetLight(-7, 4);
        createBicycle();
        const rainSystem = createRain();
        createCrosswalk();
        createAlley();

        // 鼠标事件
        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                targetRotation.y += deltaX * 0.005;
                targetRotation.x += deltaY * 0.005;
                targetRotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetRotation.x));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            targetDistance += e.deltaY * 0.02;
            targetDistance = Math.max(10, Math.min(45, targetDistance));
        });

        // 触摸事件
        let touchStartDistance = 0;
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchStartDistance = Math.sqrt(dx * dx + dy * dy);
            }
        });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;

                targetRotation.y += deltaX * 0.005;
                targetRotation.x += deltaY * 0.005;
                targetRotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetRotation.x));

                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const delta = touchStartDistance - distance;
                targetDistance += delta * 0.05;
                targetDistance = Math.max(10, Math.min(45, targetDistance));
                touchStartDistance = distance;
            }
        }, { passive: false });

        document.addEventListener('touchend', () => {
            isDragging = false;
        });

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // 平滑旋转
            rotation.x += (targetRotation.x - rotation.x) * 0.1;
            rotation.y += (targetRotation.y - rotation.y) * 0.1;
            distance += (targetDistance - distance) * 0.1;

            // 更新相机位置
            camera.position.x = Math.sin(rotation.y) * Math.cos(rotation.x) * distance;
            camera.position.y = Math.sin(rotation.x) * distance + 8;
            camera.position.z = Math.cos(rotation.y) * Math.cos(rotation.x) * distance;
            camera.lookAt(0, 2, 0);

            // 更新雨滴
            const positions = rainSystem.rain.geometry.attributes.position.array;
            for (let i = 0; i < positions.length / 3; i++) {
                positions[i * 3 + 1] -= rainSystem.velocities[i];
                if (positions[i * 3 + 1] < 0) {
                    positions[i * 3 + 1] = 30;
                    positions[i * 3] = (Math.random() - 0.5) * 50;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
                }
            }
            rainSystem.rain.geometry.attributes.position.needsUpdate = true;

            // 招牌闪烁效果（非常微妙）
            if (store && time % 3 < 0.1) {
                const sign = store.children.find(child => child.material && child.material.emissive);
                if (sign) {
                    sign.material.emissiveIntensity = 0.3 + Math.random() * 0.3;
                }
            }

            renderer.render(scene, camera);
        }

        // 加载完成
        document.getElementById('loading').classList.add('hidden');
        animate();
    </script>
</body>
</html>
