<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>雨夜のコンビニ街角 · Rainy Night Convenience Store Diorama</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a12;
    }
    #app {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    #app:active { cursor: grabbing; }
    /* Soft cinematic vignette to enhance the collectible-model feel */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%,
                  rgba(0,0,0,0) 42%,
                  rgba(0,0,0,0.35) 78%,
                  rgba(0,0,0,0.72) 100%);
      mix-blend-mode: multiply;
      z-index: 2;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="vignette"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
