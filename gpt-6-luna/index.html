const pane2=box(root,1.25,1.77,.095,2.25,2.45,.055,glass,false);pane2.material=new THREE.MeshStandardMaterial({color:0xffd7a3,roughness:.2,transparent:true,opacity:.18,emissive:0xffa447,emissiveIntensity:.32,side:THREE.DoubleSide});

box(root,0,2.98,-1.9,6.7,.12,3.65,mat(0xffecc6,.4,0,{emissive:0xffcb7a,emissiveIntensity:.6}),false);

for(let row=0;row<3;row++){
 const z=-3.35+row*.93;
 if(row<2){box(root,-.95,.95,z,1.65,1.27,.62,wood);for(let s=0;s<4;s++)box(root,-.95,.58+s*.29,z+.33,1.53,.045,.08,metal);
 for(let s=0;s<4;s++)for(let k=0;k<6;k++)box(root,-1.62+k*.26,.72+s*.29,z+.1,.17,.2,.22,productM[(k+s+row)%productM.length],false);
 } else { // refrigerated drink wall
 box(root,-2.8,1.53,z,1.12,2.35,.66,mat(0x42636b,.25,.2));for(let s=0;s<5;s++)box(root,-2.8,.58+s*.39,z+.36,1.0,.035,.05,white,false);

 }
}
// checkout counter, coffee and oden case

box(root,2.12,.76,-3.55,.92,.75,.66,mat(0xe8d8b4));box(root,2.12,1.2,-3.55,.98,.12,.72,warmGlass);for(let i=0;i<4;i++)cyl(root,1.82+i*.2,.96,-3.55,.075,.075,.24,yellow,10);

// magazine rack, back door and posters

box(root,3.35,1.35,-4.04,.5,2.0,.12,mat(0x627179));label(root,'STAFF',3.35,1.68,-3.96,.42,.22,0xe6dec8,0x344650);

box(root,0,3.02,.65,7.5,.14,.95,mat(0x293c4c));
for(let i=0;i<9;i++){const stripe=box(root,-3.65+i*.91,3.02,.67,.45,.145,.94,mat(i%2?0x4fc5d6:0xe9debc));}
// side alley entrance, alley wall, drain and grates

box(root,-4.15,.1,1.55,.12,.22,3.6,metal);for(let i=0;i<9;i++)box(root,-4.15,.22,.0+i*.35,.14,.025,.05,white);
// vending machine with glowing selection buttons
box(root,4.25,1.2,1.55,1.05,2.3,.75,mat(0x263e53,.3,.3));box(root,4.25,1.5,1.16,.86,1.2,.08,mat(0x8ddce5,.15,.12,{emissive:0x1b5368,emissiveIntensity:.4}));
for(let i=0;i<3;i++)for(let j=0;j<3;j++){cyl(root,3.95+j*.28,1.85-i*.35,1.08,.075,.075,.14,productM[(i+j)%productM.length],9)}
for(let i=0;i<3;i++)box(root,3.98+i*.27,.82,1.08,.19,.25,.045,productM[i],false);
// bicycle silhouette beside shop
const tire=mat(0x202a34,.4,.35);function wheel(x,z){const o=new THREE.Mesh(new THREE.TorusGeometry(.39,.045,8,24),tire);o.rotation.y=Math.PI/2;o.position.set(x,.43,z);root.add(o);for(let i=0;i<8;i++){const a=i*Math.PI/4;line(root,[x-.025,.43+Math.sin(a)*.34,z+Math.cos(a)*.34],[x+.025,.43-Math.sin(a)*.34,z-Math.cos(a)*.34],.009,metal)}}
wheel(2.95,2.22);wheel(4.02,2.22);line(root,[2.95,.43,2.22],[3.35,.92,2.22],.035,mat(0xb94f56));line(root,[3.35,.92,2.22],[4.02,.43,2.22],.035,mat(0xb94f56));line(root,[2.95,.43,2.22],[3.56,.43,2.22],.035,mat(0xb94f56));line(root,[3.56,.43,2.22],[3.35,.92,2.22],.035,mat(0xb94f56));line(root,[3.35,.92,2.22],[3.83,.95,2.22],.03,metal);line(root,[3.83,.95,2.22],[4.02,.43,2.22],.03,mat(0xb94f56));line(root,[3.23,1.02,2.22],[3.48,1.02,2.22],.04,metal);
// umbrella stand, umbrellas and bin
cyl(root,1.62,.32,1.28,.36,.27,.55,metal,16);for(let i=0;i<5;i++){const a=i*1.2;line(root,[1.62,.48,1.28],[1.62+Math.cos(a)*.24,1.2,1.28+Math.sin(a)*.24],.035,mat([0x66aab7,0xd35c64,0xe9bd69,0x7696c8,0xded7c3][i]));cyl(root,1.62+Math.cos(a)*.24,1.21,1.28+Math.sin(a)*.24,.15,.02,.12,mat([0x66aab7,0xd35c64,0xe9bd69,0x7696c8,0xded7c3][i]),12)}
box(root,1.12,.36,2.15,.56,.66,.56,mat(0x38545b));box(root,1.12,.72,2.15,.58,.08,.58,metal);
// guardrail and parking marker
for(let i=0;i<5;i++){cyl(root,-2.95+i*.48,.39,2.25,.055,.055,.7,metal,8)}line(root,[-3,.62,2.25],[-1.05,.62,2.25],.045,metal);
// lamppost with warm pool
cyl(root,-3.15,1.75,3.0,.075,.11,3.5,metal,10);line(root,[-3.15,3.42,3],[-2.65,3.42,3],.055,metal);box(root,-2.48,3.35,3,.48,.18,.34,mat(0xffd18a,.3,0,{emissive:0xffad50,emissiveIntensity:1.2}));const lamp=new THREE.PointLight(0xffbd73,18,6,2);lamp.position.set(-2.48,3.1,3);scene.add(lamp);
// corner pole, signs, signal head, bundled cables
cyl(root,-5.12,2.5,3.7,.11,.13,5,mat(0x454b51),10);box(root,-5.12,3.85,3.7,.72,.5,.38,mat(0x292f36));
for(let i=0;i<3;i++)cyl(root,-5.12,3.98-i*.16,3.49,.075,.075,.06,mat([0xd74d50,0xe7bc58,0x5dbb7b][i],.35,0,{emissive:[0x661111,0x604400,0x114422][i],emissiveIntensity:.55}),12);
label(root,'駅前',-5.12,3.0,3.62,.58,.32,0xf2e8cf,0x33495a);label(root,'路地',-5.12,2.58,3.62,.58,.32,0x34536a,0xe9e2cf);
for(let i=0;i<4;i++)line(root,[-7,5.5-i*.14,-1],[-4.5,4.8-i*.11,4.5],.018,mat(0x252f38));

// alley potted plants
for(const [x,z] of [[-3.6,-.15],[-4.95,-1.2],[4.7,.2]]){cyl(root,x,.2,z,.26,.32,.35,mat(0x795846),12);for(let i=0;i<6;i++){const a=i*1.05;line(root,[x,.32,z],[x+Math.cos(a)*.23,.75+(i%3)*.12,z+Math.sin(a)*.23],.055,leaf)}}
// subtle sketch-like graphic edge accents around architecture
// rain streak particles
const rainN=720,positions=new Float32Array(rainN*3),vel=new Float32Array(rainN);for(let i=0;i<rainN;i++){positions[i*3]=(Math.random()-.5)*18;positions[i*3+1]=Math.random()*11;positions[i*3+2]=(Math.random()-.5)*18;vel[i]=.12+Math.random()*.15}
const rainGeo=new THREE.BufferGeometry();rainGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xb6d8ee,size:.045,transparent:true,opacity:.58,depthWrite:false}));scene.add(rain);
// animated puddle rings
const rings=[];for(let i=0;i<9;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(.15,.012,5,32),new THREE.MeshBasicMaterial({color:0x91dce2,transparent:true,opacity:.42}));r.rotation.x=Math.PI/2;r.position.set(-4.6+Math.random()*9,-.004,-3.5+Math.random()*7);root.add(r);rings.push(r)}

// subtle hand-placed highlights on puddles; the overall scene stays calm and miniature.
let yaw=.68,pitch=.57,dist=20,drag=false,px=0,py=0;const target=new THREE.Vector3(0,1.2,0);
function placeCamera(){pitch=Math.max(.18,Math.min(1.25,pitch));camera.position.set(target.x+dist*Math.sin(yaw)*Math.cos(pitch),target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(target)}placeCamera();
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-px)*.008;pitch+=(e.clientY-py)*.006;px=e.clientX;py=e.clientY;placeCamera()});
renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(12,Math.min(31,dist+e.deltaY*.012));placeCamera()},{passive:true});
let t=0;function animate(){requestAnimationFrame(animate);t+=.016;
 const a=rainGeo.attributes.position.array;for(let i=0;i<rainN;i++){a[i*3]+=.012;a[i*3+1]-=vel[i];if(a[i*3+1]<0){a[i*3+1]=9+Math.random()*2;a[i*3]=(Math.random()-.5)*18;a[i*3+2]=(Math.random()-.5)*18}}rainGeo.attributes.position.needsUpdate=true;
 rings.forEach((r,i)=>{const p=(t*.42+i*.137)%1;r.scale.setScalar(.35+p*2.1);r.material.opacity=(1-p)*.38});
 drops.forEach((d,i)=>{const q=(t*.85+i*.17)%1;d.position.y=2.82-q*2.7;d.visible=q<.97});
 const doorOpen=(Math.sin(t*.27+1.4)> .985);doorA.position.x=doorOpen?2.52:2.7;
