<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>雨夜の街角 · ミニマート24 — ミニチュアジオラマ</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0e1a;
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  body.dragging { cursor: grabbing; }
  #scene {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* 暗角（无 UI，纯氛围） */
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      ellipse at 50% 42%,
      rgba(0,0,0,0) 52%,
      rgba(4,7,16,0.42) 88%,
      rgba(3,5,12,0.6) 100%
    );
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<script src="vendor/three.global.js"></script>
<script src="js/utils.js"></script>
<script src="js/base.js"></script>
<script src="js/store.js"></script>
<script src="js/buildings.js"></script>
<script src="js/props.js"></script>
<script src="js/rain.js"></script>
<script src="js/effects.js"></script>
<script src="js/main.js"></script>
</body>
</html>
