<head>

<style>

  canvas{display:block;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 基础 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.28;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0e1a2c, 0.012);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(14.2, 10.8, 17.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-1.5, 0.6, -0.3);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 34;
controls.maxPolarAngle = 1.42;

const S = new THREE.Group();
scene.add(S);

/* ================= 材质工具 ================= */
const gradCanvas = document.createElement('canvas');
gradCanvas.width = 4; gradCanvas.height = 1;
{
  const g = gradCanvas.getContext('2d');
  [60, 130, 200, 255].forEach((v, i) => { g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(i, 0, 1, 1); });
}
const gradMap = new THREE.CanvasTexture(gradCanvas);
gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter;
gradMap.colorSpace = THREE.NoColorSpace;

function toon(color, o = {}) { return new THREE.MeshToonMaterial({ color, gradientMap: gradMap, ...o }); }
function basic(color, o = {}) { return new THREE.MeshBasicMaterial({ color, ...o }); }

const OUT = {
  big: null, m: null, s: null
};
function makeOutlineMat(t) {
  return new THREE.ShaderMaterial({
    uniforms: { uC: { value: new THREE.Color(0x0b1220) }, uT: { value: t } },
    vertexShader: `uniform float uT; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * uT, 1.0); }`,
    fragmentShader: `uniform vec3 uC; void main(){ gl_FragColor = vec4(uC, 1.0); }`,
    side: THREE.BackSide
  });
}
OUT.big = makeOutlineMat(0.03);
OUT.m = makeOutlineMat(0.017);
OUT.s = makeOutlineMat(0.009);

function M(geo, mat, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  m.castShadow = !!o.cast;
  m.receiveShadow = !!o.recv;
  (o.parent || S).add(m);
  if (o.out) {
    const om = m.clone();
    om.material = OUT[o.out];
    om.castShadow = false; om.receiveShadow = false;
    m.parent.add(om);
  }
  return m;
}
function tube(p1, p2, r, mat, parent = S) {
  const d = new THREE.Vector3().subVectors(p2, p1);
  const len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat);
  m.position.copy(p1).add(p2).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
  m.castShadow = true;
  parent.add(m);
  return m;
}

/* ================= 画布贴图工具 ================= */
function canvasTex(w, h, draw, o = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (o.srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  if (o.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.repeat[0], o.repeat[1]); }
  t.anisotropy = 4;
  return t;
}
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function srand(seed) { return () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; }

/* 招牌 */
const signTex = canvasTex(1024, 160, (g) => {
  g.fillStyle = '#0ba573'; g.fillRect(0, 0, 1024, 160);
  g.fillStyle = '#ffffff'; rr(g, 28, 26, 108, 108, 20); g.fill();
  g.fillStyle = '#0ba573'; g.font = 'bold 74px "Arial Black", Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('24', 82, 84);
  g.fillStyle = '#ffffff'; g.textAlign = 'left'; g.font = 'bold 88px "Arial Black", Arial';
  g.fillText('TIME', 172, 86);
  g.font = '62px "Yu Gothic", "MS Gothic", sans-serif';
  g.fillText('コンビニ', 470, 80);
  g.fillStyle = '#d9ffe9'; g.font = 'bold 30px Arial';
  g.fillText('OPEN 24 HOURS', 472, 130);
});
/* 贩卖机面板 */
const venTex = canvasTex(256, 512, (g) => {
  g.fillStyle = '#0c1219'; g.fillRect(0, 0, 256, 512);
  g.fillStyle = '#c23b2e'; g.fillRect(0, 0, 256, 52);
  g.fillStyle = '#fff'; g.font = 'bold 32px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('DRINKS', 128, 27);
  const cols = ['#ff6b5e', '#ffa94d', '#ffe066', '#66d9a8', '#5ec8e8', '#8f7fe8', '#f08ab0', '#7fd45e'];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) {
    const x = 14 + c * 78, y = 68 + r * 96;
    g.fillStyle = cols[(r * 3 + c + (r % 2)) % cols.length];
    rr(g, x, y, 64, 72, 10); g.fill();
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(x + 10, y + 12, 44, 24);
    g.fillStyle = '#fff'; g.font = '16px Arial'; g.textAlign = 'center';
    g.fillText('\u00a5' + (120 + ((r * 3 + c) % 4) * 10), x + 32, y + 54);
  }
  g.fillStyle = '#1c2733'; g.fillRect(0, 462, 256, 50);
  g.fillStyle = '#39424e'; g.fillRect(20, 474, 90, 26);
});
/* 货架商品 */
function prodTex(seed) {
  return canvasTex(256, 256, (g) => {
    g.fillStyle = '#f4f1e8'; g.fillRect(0, 0, 256, 256);
    const rnd = srand(seed);
    const cols = ['#e85a4f', '#f0913f', '#f2cf4a', '#6cbf6c', '#4a9fd8', '#8f6fd8', '#e884b4', '#5ac8b4', '#c8c2b4', '#d8703a'];
    for (let row = 0; row < 4; row++) {
      const y = 10 + row * 62;
      let x = 6;
      while (x < 248) {
        const w = 14 + rnd() * 22;
        g.fillStyle = cols[Math.floor(rnd() * cols.length)];
        g.fillRect(x, y, Math.min(w, 250 - x), 46);
        x += w + 3;
      }
      g.fillStyle = '#c9c4b8'; g.fillRect(4, y + 48, 248, 4);
    }
  });
}
/* 海报 */
function posterTex(bg, acc, big, sub) {
  return canvasTex(256, 192, (g) => {
    g.fillStyle = bg; g.fillRect(0, 0, 256, 192);
    g.fillStyle = acc; rr(g, 22, 22, 66, 66, 12); g.fill();
    g.fillStyle = '#fff'; g.font = 'bold 58px "Yu Gothic", "MS Gothic", sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText(big, 108, 54);
    g.fillStyle = '#3a3a3a'; g.font = 'bold 24px Arial';
    g.fillText(sub, 108, 102);
    g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = 3;
    for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(24, 128 + i * 15); g.lineTo(232, 128 + i * 15); g.stroke(); }
  });
}
const posterA = posterTex('#ffe1cf', '#ff7a4d', 'SALE', '10% OFF');
const posterB = posterTex('#d8ecff', '#3a78d8', '\u65b0\u7740', 'NEW ARRIVAL');
const posterC = posterTex('#fff3c8', '#e0483a', '\u796d', 'NIGHT MARKET');
/* 杂志架 */
const magTex = canvasTex(256, 512, (g) => {
  g.fillStyle = '#1d232c'; g.fillRect(0, 0, 256, 512);
  const rnd = srand(77);
  const cols = ['#e85a4f', '#f0913f', '#f2cf4a', '#6cbf6c', '#4a9fd8', '#8f6fd8', '#e884b4', '#5ac8b4', '#fff', '#b8c4d8'];
  for (let s = 0; s < 4; s++) {
    const y = 14 + s * 124;
    let x = 10;
    while (x < 244) {
      const bw = 14 + rnd() * 10;
      g.fillStyle = cols[Math.floor(rnd() * cols.length)];
      g.fillRect(x, y, bw, 102);
      x += bw + 4;
    }
    g.fillStyle = '#0e1218'; g.fillRect(6, y + 102, 244, 10);
  }
});
/* 关东煮菜单 */
const odenTex = canvasTex(256, 160, (g) => {
  g.fillStyle = '#2a1f16'; g.fillRect(0, 0, 256, 160);
  g.fillStyle = '#ffe8c8'; g.font = 'bold 56px "Yu Gothic", "MS Gothic", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('\u304a\u3067\u3093', 128, 56);
  g.fillStyle = '#d8b888'; g.font = 'bold 28px Arial';
  g.fillText('ODEN', 128, 104);
  g.fillStyle = '#f2e0c0';
  for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(58 + i * 36, 136, 9, 0, 7); g.fill(); }
});
/* 咖啡吊牌 */
const coffeeTex = canvasTex(256, 160, (g) => {
  g.fillStyle = '#3a2a1e'; g.fillRect(0, 0, 256, 160);
  g.strokeStyle = '#f2e0c0'; g.lineWidth = 8;
  g.beginPath(); g.arc(64, 70, 30, 0, 7); g.stroke();
  g.beginPath(); g.arc(102, 70, 14, -1.2, 1.2); g.stroke();
  g.fillStyle = '#f2e0c0'; g.font = 'bold 40px Arial'; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('COFFEE', 130, 70);
  g.fillStyle = '#c8a878'; g.font = '20px Arial';
  g.fillText('FRESH BREW', 130, 110);
});
/* OPEN 小牌 */
const openTex = canvasTex(256, 96, (g) => {
  g.fillStyle = '#0c8a55'; g.fillRect(0, 0, 256, 96);
  g.fillStyle = '#fff'; g.font = 'bold 52px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('OPEN', 128, 50);
});
/* 单行道箭头牌 */
const arrowTex = canvasTex(128, 128, (g) => {
  g.fillStyle = '#2f6fb8'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#fff'; g.lineWidth = 6; g.strokeRect(6, 6, 116, 116);
  g.fillStyle = '#fff'; g.fillRect(28, 54, 50, 20);
  g.beginPath(); g.moveTo(78, 38); g.lineTo(104, 64); g.lineTo(78, 90); g.closePath(); g.fill();
});
/* 路名牌 */
const roadNameTex = canvasTex(256, 64, (g) => {
  g.fillStyle = '#2f8f5b'; g.fillRect(0, 0, 256, 64);
  g.fillStyle = '#fff'; g.font = 'bold 36px "Yu Gothic", "MS Gothic", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('\u5546\u5e97\u8857', 128, 34);
});
/* BAR 竖牌 */
const barTex = canvasTex(64, 192, (g) => {
  g.fillStyle = '#20140f'; g.fillRect(0, 0, 64, 192);
  g.fillStyle = '#ff8a5e';
  g.font = 'bold 44px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('B', 32, 40); g.fillText('A', 32, 96); g.fillText('R', 32, 152);
});
/* 灯箱 SALE */
const saleTex = canvasTex(256, 96, (g) => {
  g.fillStyle = '#ff8a5e'; g.fillRect(0, 0, 256, 96);
  g.fillStyle = '#fff'; g.font = 'bold 54px "Arial Black", Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('SALE 50%', 128, 50);
});
/* 便当菜单 */
const bentoTex = canvasTex(256, 128, (g) => {
  g.fillStyle = '#f7f2e6'; g.fillRect(0, 0, 256, 128);
  g.fillStyle = '#c08552'; g.font = 'bold 30px "Yu Gothic", "MS Gothic", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('\u3079\u3093\u3068\u7d0b\u3066', 128, 26);
  const foods = ['#e8a04f', '#8fbf6c', '#e06a5a'];
  for (let i = 0; i < 3; i++) {
    g.fillStyle = '#fff'; rr(g, 24 + i * 78, 46, 62, 62, 8); g.fill();
    g.fillStyle = foods[i]; g.fillRect(32 + i * 78, 58, 46, 20);
    g.fillStyle = '#3a3a3a'; g.fillRect(32 + i * 78, 86, 34, 8);
  }
});
/* 玻璃雨痕 */
const streakTex = canvasTex(256, 256, (g) => {
  g.clearRect(0, 0, 256, 256);
  const rnd = srand(4242);
  g.strokeStyle = 'rgba(159,196,224,0.85)';
  for (let i = 0; i < 46; i++) {
    const x = rnd() * 256, y = rnd() * 200, len = 30 + rnd() * 110;
    g.globalAlpha = 0.12 + rnd() * 0.35;
    g.lineWidth = 1 + rnd() * 1.4;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + len); g.stroke();
    g.beginPath(); g.arc(x, y + len, 1.6 + rnd() * 1.6, 0, 7); g.fillStyle = 'rgba(159,196,224,0.9)'; g.fill();
  }
  g.globalAlpha = 1;
});
/* 径向光斑 */
const radialTex = canvasTex(256, 256, (g) => {
  const r = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  r.addColorStop(0, 'rgba(255,255,255,1)');
  r.addColorStop(0.4, 'rgba(255,255,255,0.4)');
  r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 256, 256);
}, { srgb: false });
/* 竖向光晕（路面长条反射） */
const streakGlowTex = canvasTex(64, 256, (g) => {
  const r = g.createLinearGradient(0, 0, 0, 256);
  r.addColorStop(0, 'rgba(255,255,255,0)');
  r.addColorStop(0.6, 'rgba(255,255,255,0.5)');
  r.addColorStop(1, 'rgba(255,255,255,1)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 256);
}, { srgb: false });

/* ================= 天空 / 月 / 星 ================= */
scene.add(new THREE.Mesh(new THREE.SphereGeometry(90, 24, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec3 vP;
    void main(){
      vec3 d = normalize(vP);
      float h = clamp(d.y, -0.2, 1.0);
      vec3 top = vec3(0.012, 0.02, 0.045);
      vec3 mid = vec3(0.05, 0.09, 0.17);
      vec3 hor = vec3(0.10, 0.16, 0.26);
      vec3 c = h < 0.15 ? mix(hor, mid, smoothstep(-0.2, 0.15, h)) : mix(mid, top, smoothstep(0.15, 0.9, h));
      c += vec3(0.05, 0.04, 0.03) * pow(max(0.0, dot(d, normalize(vec3(0.0, 0.06, 1.0)))), 3.0);
      gl_FragColor = vec4(c, 1.0);
    }`
})));
{
  const n = 260, pos = new Float32Array(n * 3);
  const rnd = srand(999);
  for (let i = 0; i < n; i++) {
    const th = rnd() * Math.PI * 2, ph = Math.acos(rnd() * 0.8);
    pos[i * 3] = 80 * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = 80 * Math.cos(ph) + 4;
    pos[i * 3 + 2] = 80 * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8fa8cc, size: 1.4, sizeAttenuation: false, transparent: true, opacity: 0.55, fog: false })));
}
{
  const moon = new THREE.Mesh(new THREE.CircleGeometry(1.5, 32), new THREE.MeshBasicMaterial({ color: 0xe8f0ff, fog: false }));
  moon.position.set(-30, 24, -46);
  moon.lookAt(0, 0, 0);
  scene.add(moon);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex, color: 0xcfe0ff, transparent: true, opacity: 0.16, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }));
  halo.position.copy(moon.position);
  halo.scale.set(8, 8, 1);
  scene.add(halo);
}

/* ================= 灯光 ================= */
scene.add(new THREE.HemisphereLight(0x3d517a, 0x1a1410, 0.8));
const moonLight = new THREE.DirectionalLight(0x7a96d8, 0.8);
moonLight.position.set(-9, 15, -7);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -15; moonLight.shadow.camera.right = 15;
moonLight.shadow.camera.top = 15; moonLight.shadow.camera.bottom = -15;
moonLight.shadow.camera.far = 50;
moonLight.shadow.bias = -0.0006;
scene.add(moonLight);
const fillLight = new THREE.DirectionalLight(0x2a3a55, 0.35);
fillLight.position.set(8, 6, 14);
scene.add(fillLight);
const shadowFill = new THREE.DirectionalLight(0x46608f, 0.3);
shadowFill.position.set(-7, 9, -9);
scene.add(shadowFill);

/* ================= 底座 ================= */
const sidewalkMat = toon(0x6d7789);
const sideMat = toon(0x0d1119);
const base = M(new THREE.BoxGeometry(20, 0.6, 20),
  [sideMat, sideMat, sidewalkMat, sideMat, sideMat, sideMat],
  0, -0.3, 0, { recv: true });
S.add(new THREE.LineSegments(new THREE.EdgesGeometry(base.geometry), new THREE.LineBasicMaterial({ color: 0x2c3a52, transparent: true, opacity: 0.7 })));

/* 人行道砖缝 */
const lineMat = toon(0x5d6678);
[-6, -4, -2, 0, 2].forEach(z => M(new THREE.BoxGeometry(19.8, 0.006, 0.03), lineMat, 0, 0.003, z));
[-8, -4, -2, 0, 2, 4].forEach(x => M(new THREE.BoxGeometry(0.03, 0.006, 13.6), lineMat, x, 0.003, -3.2));
/* 湿地面整体压暗 */
M(new THREE.PlaneGeometry(19.7, 19.7), new THREE.MeshBasicMaterial({ color: 0x0a141f, transparent: true, opacity: 0.12, depthWrite: false }), 0, 0.004, 0, { rx: -Math.PI / 2 });

/* ================= 道路 ================= */
const roadMat = toon(0x33405a);
M(new THREE.BoxGeometry(20, 0.024, 4), roadMat, 0, 0, 6, { recv: true });      // 南道路
M(new THREE.BoxGeometry(3.5, 0.024, 14), roadMat, -8.25, 0, -3, { recv: true }); // 西道路
/* 路缘石 */
const curbMat = toon(0x8a93a6);
M(new THREE.BoxGeometry(20, 0.1, 0.18), curbMat, 0, 0.05, 3.91, { cast: true, recv: true });
M(new THREE.BoxGeometry(0.18, 0.1, 14), curbMat, -6.5, 0.05, -3, { cast: true, recv: true });
/* 路缘白线 */
const edgeLineMat = basic(0xdfe4ec, { transparent: true, opacity: 0.85 });
M(new THREE.BoxGeometry(19.8, 0.012, 0.08), edgeLineMat, 0, 0.02, 4.12);
M(new THREE.BoxGeometry(0.08, 0.012, 13.8), edgeLineMat, -6.68, 0.02, -3);
/* 斑马线 */
const crossMat = toon(0xe8ecf2, { emissive: 0x0a1826, emissiveIntensity: 0.6 });
/* 每根横条平行于马路(x向)，沿过马路方向(z向)铺开 */
for (let i = 0; i < 6; i++) M(new THREE.BoxGeometry(2.4, 0.012, 0.5), crossMat, -2.9, 0.02, 4.4 + i * 0.6);
/* 停车位标线（西道路） */
const parkMat = basic(0xdfe4ec, { transparent: true, opacity: 0.75 });
[[ -7.0, -7.0 ], [ -3.0, -3.0 ]].forEach(([za, zb]) => {
  M(new THREE.BoxGeometry(2.3, 0.012, 0.07), parkMat, -8.4, 0.02, za);
  M(new THREE.BoxGeometry(2.3, 0.012, 0.07), parkMat, -8.4, 0.02, zb);
  M(new THREE.BoxGeometry(0.07, 0.012, Math.abs(zb - za)), parkMat, -9.55, 0.02, (za + zb) / 2);
});
/* 排水沟格栅 */
const grateMat = basic(0x10151d);
[3.2, -1.2, 6.0].forEach(x => M(new THREE.BoxGeometry(0.55, 0.014, 0.16), grateMat, x, 0.02, 3.84));
[-6, -1, 2].forEach(z => M(new THREE.BoxGeometry(0.16, 0.014, 0.55), grateMat, -6.58, 0.02, z));

/* ================= 积水 ================= */
const puddleMat = new THREE.MeshPhysicalMaterial({ color: 0x0d1a26, roughness: 0.12, metalness: 0.65, transparent: true, opacity: 0.88, emissive: 0x0a141f, emissiveIntensity: 0.5 });
function puddle(x, z, rx, rz, y = 0.017) {
  const m = M(new THREE.CircleGeometry(1, 28).rotateX(-Math.PI / 2), puddleMat, x, y, z);
  m.scale.set(rx, 1, rz);
  m.renderOrder = 4;
  return m;
}
const PUD = [

/* ================= 降雨系统 ================= */
const RAIN_N = 1500, rainTop = 10, rainLen = 0.3;
const rainPos = new Float32Array(RAIN_N * 6);
const rainSpd = new Float32Array(RAIN_N);
{
  const rnd = srand(2026);
  for (let i = 0; i < RAIN_N; i++) {
    const x = (rnd() * 2 - 1) * 11, z = (rnd() * 2 - 1) * 11, y = rnd() * rainTop;
    rainPos[i * 6 + 0] = x; rainPos[i * 6 + 1] = y; rainPos[i * 6 + 2] = z;
    rainPos[i * 6 + 3] = x - 0.05; rainPos[i * 6 + 4] = y - rainLen; rainPos[i * 6 + 5] = z + 0.02;
    rainSpd[i] = 7 + rnd() * 3;
  }
}
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0x9fc0e0, transparent: true, opacity: 0.32, depthWrite: false }));
rain.frustumCulled = false;
rain.renderOrder = 8;
S.add(rain);
function onRoad(x, z) { return (z > 4 && z < 8) || (x < -6.5 && z < 4); }
function updateRain(dt) {
  const p = rainGeo.attributes.position.array;
  for (let i = 0; i < RAIN_N; i++) {
    let y = p[i * 6 + 1] - rainSpd[i] * dt;
    if (y < 0) {
      y += rainTop;
      const x = (Math.random() * 2 - 1) * 11, z = (Math.random() * 2 - 1) * 11;
      p[i * 6 + 0] = x; p[i * 6 + 2] = z;
      p[i * 6 + 3] = x - 0.05; p[i * 6 + 5] = z + 0.02;
      if (Math.random() < 0.02 && onRoad(x, z)) spawnRipple(x, 0.02, z, 0.35, 0.7, 0.3);
    }
    p[i * 6 + 1] = y; p[i * 6 + 4] = y - rainLen;
  }
  rainGeo.attributes.position.needsUpdate = true;
}

const ripples = [];
{
  const geo = new THREE.RingGeometry(0.42, 0.5, 26);
  geo.rotateX(-Math.PI / 2);
  for (let i = 0; i < 30; i++) {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xa8cce8, transparent: true, opacity: 0, depthWrite: false }));
    m.visible = false;
    m.renderOrder = 5;
    S.add(m);
    ripples.push({ mesh: m, life: 0, max: 1, s1: 1, op: 0.4 });
  }
}
let rippleIdx = 0;
function spawnRipple(x, y, z, s1, life, op = 0.4) {
  const r = ripples[rippleIdx++ % ripples.length];
  r.mesh.position.set(x, y, z);
  r.life = 0; r.max = life; r.s1 = s1; r.op = op;
  r.mesh.visible = true;
}
let ambientRippleT = 0;
function updateRipples(dt, t) {
  for (const r of ripples) {
    if (!r.mesh.visible) continue;
    r.life += dt;
    const k = r.life / r.max;
    if (k >= 1) { r.mesh.visible = false; continue; }
    const e = 1 - (1 - k) * (1 - k);
    const s = 0.25 + e * r.s1;
    r.mesh.scale.set(s, 1, s);
    r.mesh.material.opacity = r.op * (1 - k);
  }
  ambientRippleT += dt;
  if (ambientRippleT > 0.28) {
    ambientRippleT = 0;
    const p = PUD[Math.floor(Math.random() * PUD.length)];
    spawnRipple(p.x + (Math.random() - 0.5) * p.rx * 1.4, p.y + 0.002, p.z + (Math.random() - 0.5) * p.rz * 1.4, 0.8, 1.1, 0.35);
  }
}

const dripSources = [
  { x: -3.3, z: 3.82, next: 0.5 },

const dripPool = [];
{
  const g = new THREE.SphereGeometry(0.022, 8, 6);
  const m = basic(0xbcd8ee);
  for (let i = 0; i < 9; i++) {
    const s = new THREE.Mesh(g, m);
    s.visible = false;
    S.add(s);
    dripPool.push({ m: s, y: 0, vy: 0, active: false });
  }

function updateDrips(dt, t) {
  for (const src of dripSources) {
    if (t >= src.next) {
      const d = dripPool.find(d => !d.active);
      if (d) {
        d.active = true;
        d.m.position.set(src.x + (Math.random() - 0.5) * 0.08, 2.45, src.z + (Math.random() - 0.5) * 0.06);
        d.m.visible = true;
        d.y = 2.45; d.vy = 0;
      }
      src.next = t + 0.4 + Math.random() * 1.1;
    }
  }
  for (const d of dripPool) {
    if (!d.active) continue;
    d.vy -= 6.5 * dt;
    d.y += d.vy * dt;
    d.m.position.y = d.y;
    if (d.y <= 0.02) {
      d.active = false;
      d.m.visible = false;
      spawnRipple(d.m.position.x, 0.012, d.m.position.z, 0.4, 0.9, 0.5);
    }
  }
}

/* 蒸汽（关东煮） */
const steams = [];
for (let i = 0; i < 3; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex, color: 0xdfe8f2, transparent: true, opacity: 0, depthWrite: false }));
  s.position.set(-3.6 + (i - 1) * 0.16, 0.95, 1.5);
  s.renderOrder = 6;
  S.add(s);
  steams.push({ s, off: i * 0.33 });
}
function updateSteam(t) {
  for (const st of steams) {
    const p = ((t * 0.22) + st.off) % 1;
    st.s.position.y = 0.95 + p * 0.75;
    st.s.material.opacity = 0.15 * Math.sin(Math.PI * p);
    const sc = 0.12 + p * 0.3;
    st.s.scale.set(sc, sc, 1);
  }
}

/* ================= 动效状态 ================= */
function doorOffset(t) {
  const c = t % 18;
  const e = x => x * x * (3 - 2 * x);
  if (c < 7 || c >= 13.5) return 0;
  if (c < 8.5) return e((c - 7) / 1.5) * 0.75;
  if (c < 12) return 0.75;
  return (1 - e((c - 12) / 1.5)) * 0.75;
}
function flick(t) {
  const n = Math.sin(Math.floor(t * 24) * 127.1) * 43758.5453;
  const f = n - Math.floor(n);
  const dip = f > 0.988 ? 0.45 + 0.3 * Math.abs(Math.sin(t * 55)) : 1;
  return (0.92 + 0.08 * Math.sin(t * 9.3) + 0.02 * Math.sin(t * 23.7)) * dip;
}
const COL_RED = new THREE.Color(0xff5a4a);
const COL_GREEN = new THREE.Color(0x53e08a);
const glowTargets = [];
scene.traverse(o => {
  if (o.userData && (o.userData.coolerGlow || o.userData.venGlow)) glowTargets.push(o);
});

/* ================= 主循环 ================= */
let T = 0;
let lastReal = performance.now();
function step(dt) {
  T += dt;
  controls.update();

  updateRain(dt);
  updateRipples(dt, T);
  updateDrips(dt, T);
  updateSteam(T);

  /* 自动门 */
  const off = doorOffset(T);
  doorGroupA.position.x = -2.4 - off;
  doorGroupB.position.x = -1.6 + off;

  /* 招牌 / 灯箱闪烁 */
  const f = flick(T);
  signFrontMat.color.setScalar(f);
  ledMat.color.setRGB(0.08 * f, 0.88 * f, 0.54 * f);
  saleMat.color.setScalar(0.9 + 0.1 * Math.sin(T * 7.1));
  for (const g of glowTargets) g.material.color.setScalar(0.92 + 0.08 * Math.sin(T * 5.3 + g.position.x));

  /* 交通信号灯 */
  const phase = T % 16;
  const redOn = phase < 7.6;
  redLampMat.color.set(redOn ? 0xff5546 : 0x331512);
  greenLampMat.color.set(!redOn ? 0x53e08a : 0x0f2418);
  trafficBlobMat.color.lerp(redOn ? COL_RED : COL_GREEN, 0.06);

  /* 光斑呼吸 */
  [blobStore, blobLight, blobVen, trafficBlob, blobAlley].forEach(b => {
    b.material.opacity = b.userData.base * (0.82 + 0.18 * Math.sin(T * 2.7 + b.userData.ph));
  });

  /* 玻璃雨痕 */
  stA.offset.y = (T * 0.02) % 1;
  stB.offset.y = (0.3 + T * 0.035) % 1;
  stW.offset.y = (0.6 + T * 0.025) % 1;

  renderer.render(scene, camera);
}
function onFrame() {
  const now = performance.now();
  const dt = Math.min((now - lastReal) / 1000, 0.05);
  lastReal = now;
  step(dt);
}
requestAnimationFrame(function loop() { requestAnimationFrame(loop); onFrame(); });
/* 兜底：rAF 被节流（无头 / 隐藏标签页）时用 interval 驱动 */
setInterval(() => {
  const now = performance.now();
  if (now - lastReal < 80) return;
  lastReal = now;
  step(0.016);
}, 16);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
