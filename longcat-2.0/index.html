function createShelf(x, z, rotation = 0) {

  const frame = new THREE.Mesh(frameGeo, frameMat);

    const shelfBoard = new THREE.Mesh(
      new THREE.BoxGeometry(2.05, 0.05, 0.52),
      toonMaterial(0xa09078)
    );
    shelfBoard.position.y = 0.5 + j * 0.7;
    group.add(shelfBoard);
    
    // Products on shelf

      const pHeight = 0.15 + Math.random() * 0.25;
      const pGeo = new THREE.BoxGeometry(0.12, pHeight, 0.15);
      const pColor = [0xe74c3c, 0x2ecc71, 0x3498db, 0xf39c12, 0x9b59b6, 0xe67e22][Math.floor(Math.random() * 6)];

      const product = new THREE.Mesh(pGeo, pMat);
      product.position.set(k * 0.18, 0.5 + j * 0.7 + pHeight / 2 + 0.03, 0);
      group.add(product);
    }
  }
  
  group.position.set(x, 0, z);
  group.rotation.y = rotation;
  return group;
}

// Wires
function createWire(start, end) {
  const points = [];
  const midY = Math.max(start.y, end.y) - 0.5;
  for (let t = 0; t <= 1; t += 0.1) {
    const x = start.x + (end.x - start.x) * t;
    const y = start.y + (end.y - start.y) * t - Math.sin(t * Math.PI) * 0.5;
    const z = start.z + (end.z - start.z) * t;
    points.push(new THREE.Vector3(x, y, z));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve, 20, 0.015, 4, false);
  const mat = toonMaterial(0x222222);
  return new THREE.Mesh(geo, mat);
}

// === ANIMATION ===
const clock = new THREE.Clock();
let trafficLightTimer = 0;
let trafficLightRed = true;
let signFlickerTimer = 0;
let signBrightness = 1;

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  const delta = clock.getDelta();

  // Rain animation
  const positions = rain.geometry.attributes.position.array;
  for (let i = 0; i < rainCount; i++) {
    positions[i * 3 + 1] -= rainVelocities[i];
    positions[i * 3] += 0.01; // slight wind drift
    
    if (positions[i * 3 + 1] < 0) {
      positions[i * 3 + 1] = 12 + Math.random() * 3;
      positions[i * 3] = (Math.random() - 0.5) * 30;
    }
  }
  rain.geometry.attributes.position.needsUpdate = true;

  // Puddle ripples
  puddles.forEach((puddle, i) => {
    puddle.material.opacity = 0.5 + Math.sin(elapsed * 2 + puddle.userData.phase) * 0.3;
    const scale = 1 + Math.sin(elapsed * 3 + i) * 0.05;
    puddle.scale.set(scale, scale, 1);
  });

  // Door animation
  doorTimer += delta;
  if (doorTimer > 4 + Math.random() * 6) {
    doorDirection = doorDirection === 0 ? 1 : -1;
    doorTimer = 0;
  }
  if (doorDirection === 1) {
    doorOpen = Math.min(doorOpen + delta * 2, 0.85);
  } else {
    doorOpen = Math.max(doorOpen - delta * 2, 0);
  }
  doorL.position.x = -0.45 - doorOpen;
  doorR.position.x = 0.45 + doorOpen;

  // Sign flicker
  signFlickerTimer += delta;
  if (signFlickerTimer > 0.05) {
    signBrightness = 0.8 + Math.random() * 0.2;
    signFlickerTimer = 0;
  }
  sign.material.emissiveIntensity = signBrightness;
  signLight.intensity = 2 * signBrightness;

  // Traffic light
  trafficLightTimer += delta;
  if (trafficLightTimer > 5) {
    trafficLightTimer = 0;
    trafficLightRed = !trafficLightRed;
    if (trafficLightRed) {
      tlRedMat.emissiveIntensity = 0.8;
      tlGreenMat.emissiveIntensity = 0;
      tlLight.color.setHex(0xff0000);
    } else {
      tlRedMat.emissiveIntensity = 0;
      tlGreenMat.emissiveIntensity = 0.8;
      tlLight.color.setHex(0x00ff00);
    }
  }

  // Droplets on glass (sliding down)
  const dPositions = droplets.geometry.attributes.position.array;
  for (let i = 0; i < dropletCount; i++) {
    dPositions[i * 3 + 1] -= 0.002 + Math.random() * 0.001;
    if (dPositions[i * 3 + 1] < 0.5) {
      dPositions[i * 3 + 1] = 3 + Math.random() * 0.5;
      dPositions[i * 3] = -3.5 + Math.random() * 7;
    }
  }
  droplets.geometry.attributes.position.needsUpdate = true;

  // Store interior gentle glow variation
  intLight1.intensity = 3 + Math.sin(elapsed * 0.5) * 0.1;
  intLight2.intensity = 2 + Math.cos(elapsed * 0.7) * 0.1;

  // AC unit slight vibration
  acGroup.position.x = 4 + Math.sin(elapsed * 20) * 0.005;

  // Lamp light gentle flicker
  lampLight.intensity = 2 + Math.sin(elapsed * 1.5) * 0.1;

  controls.update();
  renderer.render(scene, camera);
}

});
