<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101726" />
    <title>雨夜街角 · 小さなコンビニ</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: radial-gradient(ellipse at 48% 40%, #263450 0%, #111a2d 50%, #090f1b 100%); }
      body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 38%, rgba(3, 7, 18, .48) 100%); }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; cursor: grab; }
      canvas:active { cursor: grabbing; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
