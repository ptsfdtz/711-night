<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x07101e); scene.fog=new THREE.FogExp2(0x07101e,.042);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100); camera.position.set(11,8.5,12);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15; document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,1.5,0); controls.enableDamping=true; controls.dampingFactor=.055; controls.minDistance=8; controls.maxDistance=22; controls.maxPolarAngle=Math.PI*.48; controls.autoRotate=true; controls.autoRotateSpeed=.28;
renderer.domElement.addEventListener('pointerdown',()=>controls.autoRotate=false,{once:true});

const A={navy:0x102338,asphalt:0x26374a,edge:0x8ba1aa,cream:0xffebc4,white:0xfaf5e9,cyan:0x52c5e8,blue:0x387cc5,green:0x62b78d,orange:0xffa45b,red:0xf05b61,glass:0x9ed7e4,dark:0x142133};
const mat=(color,em=0,emc=color)=>new THREE.MeshStandardMaterial({color,roughness:.62,metalness:.05,emissive:emc,emissiveIntensity:em});
const glass=new THREE.MeshPhysicalMaterial({color:0x98ced8,transparent:true,opacity:.42,roughness:.1,metalness:.05,transmission:.05});
const wet=mat(A.asphalt); wet.roughness=.28; wet.metalness=.42;
function box(x,y,z,w,h,d,m,bevel=.04){const g=new THREE.BoxGeometry(w,h,d,1,1,1); const o=new THREE.Mesh(g,m); o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function cyl(x,y,z,r,h,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function line(points,color,width=.035){const g=new THREE.BufferGeometry().setFromPoints(points);const o=new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:.8}));scene.add(o);return o}
function signText(text,color=A.white,size=.35){const c=document.createElement('canvas');c.width=512;c.height=150;const x=c.getContext('2d');x.clearRect(0,0,512,150);x.font='bold 86px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#'+color.toString(16).padStart(6,'0');x.fillText(text,256,76);const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false});}

// square collectible base
box(0,-.42,0,12.6,.65,12.6,mat(0x132133)); box(0,-.06,0,12.25,.12,12.25,mat(0x4b6570));
box(-1.4,.03,0,8.8,.12,11.9,wet); box(4.6,.04,0,3,.14,11.9,wet); // street corner
// pavement and alley
box(-4.9,.12,0,2.45,.12,11.9,mat(0x60737a)); box(2.65,.12,-4.5,4,.12,2.6,mat(0x53666d));
for(let i=-5;i<6;i++) {box(-4.9,.205,i,2.25,.018,.035,mat(0x91a6a8)); box(i,.21,-5.55,.035,.018,.18,mat(0x91a6a8));}
// parking boundary, drainage and crosswalk
for(let z=-3;z<3;z+=1.6) box(3.7,.22,z,.08,.02,.82,mat(A.white));
for(let x=-.1;x<2.1;x+=.45) box(x,.22,-3.7,.24,.02,1.15,mat(A.white));
box(-3.75,.21,0,.1,.03,11.5,mat(0x172631)); for(let z=-5;z<5;z+=.5) box(-3.75,.235,z,.35,.016,.03,mat(0x8ba6aa));
// puddles
const puddles=[]; for(const [x,z,s] of [[-2.7,3.5,1.25],[2.7,2.1,.9],[1.4,-2.5,1.1],[-.4,4.8,.75]]){const p=new THREE.Mesh(new THREE.CircleGeometry(s,32),new THREE.MeshStandardMaterial({color:0x315c70,roughness:.05,metalness:.8,transparent:true,opacity:.72}));p.rotation.x=-Math.PI/2;p.position.set(x,.225,z);scene.add(p);puddles.push(p)}
// shop shell, warm interior
box(-.35,2.25,-.1,6.4,4.3,4.75,mat(0xe5e3d6));
box(-.35,4.47,-.1,6.7,.28,4.98,mat(0x20354a));
box(-.35,4.72,-.1,7.05,.25,5.25,mat(A.white));
const warm=new THREE.PointLight(0xffc87b,35,11,2);warm.position.set(-.6,3.7,-1.1);scene.add(warm);
for(let x=-2.8;x<2.8;x+=1.35){const l=new THREE.PointLight(0xfff0c6,4,4,2);l.position.set(x,3.95,-1.5);scene.add(l);box(x,4.17,-1.4,1,.06,.42,mat(A.cream,1.2,A.cream));}
// front dark transparent window façade / door panels
box(-.35,2.25,2.3,6.12,3.85,.045,glass); 
for(const x of [-3.4,-1.25,.05,1.55,2.7]) box(x,2.25,2.36,.09,4.05,.12,mat(0x233848));
// automatic door in front
const doorL=box(-.58,2.1,2.39,1.28,3.25,.06,glass),doorR=box(.77,2.1,2.39,1.28,3.25,.06,glass); box(.1,.34,2.55,2.8,.09,.82,mat(0x294149));
// shop fascia bands
for(const [y,c] of [[4.49,A.orange],[4.67,A.green],[4.85,A.cyan]]) box(-.35,y,2.55,6.95,.14,.15,mat(c, .25,c));
const logo=box(-.5,5.18,2.55,3.25,.72,.13,mat(A.white,1,A.white));logo.material=signText('N I G H T  M A R T',A.blue);
// shelves inside visible from street
function shelf(x,z,w=1.2){box(x,1.05,z,w,1.25,.38,mat(0xdecfae));for(let y=1.1;y<1.9;y+=.25){box(x,y,z+.22,w-.14,.08,.08,mat(0xffffff));for(let i=-.4;i<=.4;i+=.2) box(x+i,y+.1,z+.26,.12,.13,.1,mat([A.orange,A.cyan,A.green,A.red][Math.round((i+.4)*10)%4]));}}
for(let x=-2.45;x<2.1;x+=1.1) shelf(x,.45,.86); shelf(-2.55,-1.15,1);shelf(1.95,-1.15,.9);
// counter + coffee / hot food
box(2.28,1.18,1.25,.72,1.55,.62,mat(0x736359));box(2.28,2.02,1.25,.75,.12,.65,mat(A.cream));box(2.1,2.18,1.15,.22,.27,.2,mat(0x273c43));
box(1.42,1.55,1.28,.52,.45,.36,mat(0x4b6c72));cyl(1.42,1.83,1.28,.12,.12,mat(A.cream));
// refrigerated cases / magazine rack
box(-2.8,1.45,1.52,.75,2.3,.35,mat(0xc8e9ed));for(let y=.8;y<2.35;y+=.35)box(-2.8,y,1.72,.6,.02,.04,mat(A.cyan,.4,A.cyan));
box(-1.55,1.12,1.56,.6,1.45,.16,mat(0x51646d));for(let y=.7;y<1.65;y+=.23)box(-1.55,y,1.69,.48,.11,.03,mat(A.red));
// wall posters
for(const [x,c,t] of [[-2.75,A.red,'HOT!'],[-1.75,A.cyan,'MEAL'],[1.2,A.green,'24H']]){const p=box(x,2.8,2.325,.65,.8,.02,mat(A.white));p.material=signText(t,c)}
// roof AC
box(2.4,4.55,-1.45,.8,.6,.45,mat(0x87949a));const fan=cyl(2.4,4.55,-1.72,.22,.03,mat(0x33454b));fan.rotation.x=Math.PI/2;
// vending machine
box(-3.55,1.45,2.0,.75,2.5,.62,mat(0x2586bc));const vm=box(-3.55,1.72,2.33,.58,1.48,.02,mat(A.white,1,A.white));for(let y=1.3;y<2.25;y+=.3)for(let x=-3.72;x<-3.35;x+=.18)box(x,y,2.36,.12,.14,.03,mat([A.orange,A.green,A.cyan][Math.floor((y+x)*6)%3],.5));
// bicycle
for(const x of [-2.9,-1.82]){const w=new THREE.Mesh(new THREE.TorusGeometry(.42,.045,8,18),mat(0x15212b));w.rotation.y=Math.PI/2;w.position.set(x,.65,3.25);scene.add(w)} line([new THREE.Vector3(-2.9,.65,3.25),new THREE.Vector3(-2.45,1.35,3.25),new THREE.Vector3(-1.82,.65,3.25),new THREE.Vector3(-2.65,.78,3.25),new THREE.Vector3(-2.2,.78,3.25),new THREE.Vector3(-2.45,1.35,3.25)],A.orange,.05);
// umbrella rack and bins
for(let i=0;i<4;i++){cyl(.95,.7,2.88,.035,.7,mat(0x30485a));const u=new THREE.Mesh(new THREE.ConeGeometry(.22,.1,12),mat(i%2?A.cyan:A.red));u.position.set(.95,.96,2.88);scene.add(u)}
box(2.8,.66,2.8,.55,.7,.48,mat(0x69828a));box(3.38,.66,2.8,.4,.7,.48,mat(0x5b7076));
// street lamp, pole and wires
cyl(-4.6,2.55,-3.5,.12,4.8,mat(0x344650));box(-4.35,4.7,-3.5,.55,.12,.12,mat(0x344650));const lamp=box(-4.1,4.48,-3.5,.38,.25,.38,mat(A.cream,2,A.cream));const glow=new THREE.PointLight(0xffdf9b,9,7,2);glow.position.set(-4.1,4.2,-3.5);scene.add(glow);
cyl(4.4,2.0,-4.5,.12,3.8,mat(0x263844));for(const z of [-4.3,-1.7,1.7,4.5])line([new THREE.Vector3(4.4,3.7,-4.5),new THREE.Vector3(3.9,3.4,z),new THREE.Vector3(2.9,3.25,z)],0x1a2937,.025);
// traffic light, street sign, rail
cyl(3.8,1.2,-3.0,.07,2.1,mat(0x394b53));box(3.8,2.28,-3,.38,.7,.22,mat(0x1c2931));const signal=new THREE.Mesh(new THREE.SphereGeometry(.1,12,12),mat(A.red,2,A.red));signal.position.set(3.8,2.48,-3.13);scene.add(signal);
cyl(-4.25,1.0,2.25,.055,1.5,mat(0x43555d));box(-4.25,1.78,2.25,.72,.42,.08,mat(A.blue));const ss=box(-4.25,1.78,2.30,.66,.34,.01,mat(A.white));ss.material=signText('駅 →',A.blue);
for(let z=-1;z<2.3;z+=.8){cyl(3.15,.55,z,.05,.85,mat(0x8da0a0));} line([new THREE.Vector3(3.15,.95,-1),new THREE.Vector3(3.15,.95,2.2)],0x8da0a0,.06);
// notice board and alley articulation
box(-4.72,1.42,3.85,.8,1.45,.12,mat(0x3d4c51));const nb=box(-4.72,1.42,3.93,.65,1.15,.02,mat(A.cream));nb.material=signText('雨の日\nお知らせ',A.red);
box(4.55,1.15,3.9,.35,2.1,3.25,mat(0x233444));box(3.85,1.05,4.85,1.1,1.85,.45,mat(0x394a55));
// rain system
const drops=900, pos=new Float32Array(drops*3);for(let i=0;i<drops;i++){pos[i*3]=(Math.random()-.5)*15;pos[i*3+1]=Math.random()*9;pos[i*3+2]=(Math.random()-.5)*15}const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(pos,3));const rain=new THREE.Points(rg,new THREE.PointsMaterial({color:0xb8e7ff,size:.035,transparent:true,opacity:.72}));scene.add(rain);
const ring=new THREE.Mesh(new THREE.RingGeometry(.1,.13,24),new THREE.MeshBasicMaterial({color:0xa8e8ff,transparent:true,opacity:.65,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(-2.7,.24,3.5);scene.add(ring);
const clock=new THREE.Clock(); function tick(){const t=clock.getElapsedTime();const a=rg.attributes.position.array;for(let i=0;i<drops;i++){a[i*3+1]-=.12;if(a[i*3+1]<.18){a[i*3+1]=8.5;a[i*3]=(Math.random()-.5)*15;a[i*3+2]=(Math.random()-.5)*15}}rg.attributes.position.needsUpdate=true;const pulse=.72+Math.sin(t*3.4)*.22;logo.material.opacity=pulse;ring.scale.setScalar(.75+(t%1.5)/1.5*2.4);ring.material.opacity=.75-(t%1.5)/1.5*.65;doorL.position.x=-.58-Math.max(0,Math.sin(t*.42))* .42;doorR.position.x=.77+Math.max(0,Math.sin(t*.42))* .42;signal.material.emissiveIntensity=.6+Math.max(0,Math.sin(t*.8))*1.4;puddles.forEach((p,i)=>p.material.emissiveIntensity=.08+Math.sin(t*1.3+i)*.04);controls.update();renderer.render(scene,camera);requestAnimationFrame(tick)}tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
