<div id="app"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- core ---------- */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f1a);
scene.fog = new THREE.FogExp2(0x0b0f1a, 0.045);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(14, 11, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 7;
controls.maxDistance = 36;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minPolarAngle = Math.PI * 0.12;
controls.target.set(0, 1.6, 0);

/* ---------- tone / toon gradient ---------- */
function makeToonGradient(stops=[0.25, 0.55, 1.0]) {
  const c = document.createElement('canvas'); c.width = stops.length; c.height = 1;
  const ctx = c.getContext('2d');
  stops.forEach((v,i)=>{ ctx.fillStyle = `rgb(${Math.floor(v*255)},${Math.floor(v*255)},${Math.floor(v*255)})`; ctx.fillRect(i,0,1,1); });
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = tex.magFilter = THREE.NearestFilter;
  return tex;
}
const toonGrad3 = makeToonGradient([0.15, 0.55, 1.0]);
const toonGrad4 = makeToonGradient([0.1, 0.4, 0.7, 1.0]);

const toon = (color, opts={}) => new THREE.MeshToonMaterial({
  color, gradientMap: toonGrad3, ...opts
});

/* ---------- outline (inverted hull) ---------- */
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x0a0c12, side: THREE.BackSide });
function addOutline(mesh, scale=1.03) {
  const o = new THREE.Mesh(mesh.geometry, outlineMat);
  o.scale.multiplyScalar(scale);
  o.renderOrder = -1;
  mesh.add(o);
  return o;
}

/* ---------- base pedestal ---------- */
const root = new THREE.Group();
scene.add(root);

const baseSize = 14;
const base = new THREE.Mesh(
  new THREE.BoxGeometry(baseSize, 0.5, baseSize),
  toon(0x1c2230)
);
base.position.y = -0.25;
base.receiveShadow = true;
root.add(base);

const baseEdge = new THREE.Mesh(
  new THREE.BoxGeometry(baseSize+0.05, 0.06, baseSize+0.05),
  toon(0x0e1218)
);
baseEdge.position.y = 0.03;
root.add(baseEdge);

/* ---------- ground (street & sidewalk) ---------- */
const ground = new THREE.Group();
root.add(ground);

const streetTex = (()=>{
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1c2330'; ctx.fillRect(0,0,256,256);
  for (let i=0;i<1400;i++){
    ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.18})`;
    const x=Math.random()*256, y=Math.random()*256, r=Math.random()*1.4+0.3;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  // lane divider reflection
  ctx.fillStyle = '#f4d27a';
  ctx.fillRect(0, 120, 256, 2);
  ctx.fillRect(0, 124, 256, 1);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2,2);
  return t;
})();

const streetMat = toon(0xffffff, { map: streetTex });
streetMat.map.colorSpace = THREE.SRGBColorSpace;

const street = new THREE.Mesh(new THREE.PlaneGeometry(baseSize*0.55, baseSize), streetMat);
street.rotation.x = -Math.PI/2;
street.position.set(baseSize*0.275, 0.011, 0);
street.receiveShadow = true;
ground.add(street);

const sidewalkTex = (()=>{
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a4150'; ctx.fillRect(0,0,256,256);
  ctx.strokeStyle = '#272d38'; ctx.lineWidth = 1;
  for (let i=0;i<8;i++){
    const y = i*32;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(256,y); ctx.stroke();
  }
  for (let i=0;i<8;i++){
    const x = i*32;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,256); ctx.stroke();
  }
  for (let i=0;i<300;i++){
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.05})`;
    ctx.fillRect(Math.random()*256, Math.random()*256, 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3,3);
  return t;
})();
const sidewalkMat = toon(0xffffff, { map: sidewalkTex });
sidewalkMat.map.colorSpace = THREE.SRGBColorSpace;
const sidewalk = new THREE.Mesh(new THREE.PlaneGeometry(baseSize*0.45, baseSize), sidewalkMat);
sidewalk.rotation.x = -Math.PI/2;
sidewalk.position.set(-baseSize*0.225, 0.012, 0);
sidewalk.receiveShadow = true;
ground.add(sidewalk);

const curb = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.12, baseSize), toon(0x6b7280));
curb.position.set(-0.025, 0.06, 0);
ground.add(curb);

const store = new THREE.Group();
root.add(store);
store.position.set(-0.6, 0.12, -0.4);

const storeW = 5.6, storeD = 4.4, storeH = 3.0;

// storefront pillars
const pillarMat = toon(0xefe8d2);

// awning
const awning = new THREE.Group();
store.add(awning);
const awningRoof = new THREE.Mesh(
  new THREE.BoxGeometry(storeW+0.8, 0.08, 1.0),

);
awningRoof.position.set(0, storeH-0.45, storeD/2+0.45);
awning.add(awningRoof);
const awningStripe = new THREE.Mesh(

);

// scalloped awning trim

    new THREE.ConeGeometry(0.16, 0.18, 3),

  );

  tri.position.set(-storeW/2+0.4+i*0.18, storeH-0.92, storeD/2+0.95);

// storefront sign (top)
function makeSignTexture(text, sub, bgColor, txtColor){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bgColor; ctx.fillRect(0,0,1024,256);
  // stripes
  ctx.fillStyle = '#ffffff22';
  for (let i=0;i<1024;i+=24) ctx.fillRect(i,0,12,256);
  ctx.fillStyle = txtColor;
  ctx.font = 'bold 130px "Hiragino Sans", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 512, 110);
  ctx.font = 'bold 50px sans-serif';
  ctx.fillStyle = '#fff8';
  ctx.fillText(sub, 512, 200);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const signTex = makeSignTexture('コンビニ', '24h OPEN', '#0d3a8c', '#fff8e0');
const signMat = new THREE.MeshBasicMaterial({ map: signTex });
const sign = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.9), signMat);

const signSideBack = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.6), new THREE.MeshBasicMaterial({ color: 0x0d3a8c }));
signSideBack.position.set(-storeW/2+0.05, storeH+0.2, 0);
signSideBack.rotation.y = -Math.PI/2;
store.add(signSideBack);

/* ---------- glass windows ---------- */
const windowGroup = new THREE.Group();
store.add(windowGroup);

function makeGlassPane(w, h){
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  // base glass
  ctx.fillStyle = '#0a1828';
  ctx.fillRect(0,0,256,256);
  // rain streaks (vertical)
  ctx.strokeStyle = 'rgba(180,210,230,0.35)';
  ctx.lineWidth = 1.5;
  for (let i=0;i<60;i++){
    const x = Math.random()*256, y0 = Math.random()*256, len = 30+Math.random()*70;
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x+0.5, y0+len); ctx.stroke();
  }
  // drops
  for (let i=0;i<40;i++){
    ctx.fillStyle = `rgba(200,220,235,${0.2+Math.random()*0.5})`;
    const x=Math.random()*256, y=Math.random()*256, r=Math.random()*2+0.5;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  // smudges
  for (let i=0;i<6;i++){
    const grad = ctx.createRadialGradient(Math.random()*256, Math.random()*256, 0, Math.random()*256, Math.random()*256, 50);
    grad.addColorStop(0, 'rgba(220,235,245,0.07)');
    grad.addColorStop(1, 'rgba(220,235,245,0)');
    ctx.fillStyle = grad; ctx.fillRect(0,0,256,256);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
}

// two large display windows on storefront
[-2.3, 0, 2.3].forEach((x,i)=>{
  if (i===1) return; // skip center (door area)
  const win = new THREE.Mesh(
    new THREE.PlaneGeometry(2.2, 1.95),
    makeGlassPane(2.2, 1.95)
  );
  win.position.set(x, 1.0, storeD/2+0.005);
  windowGroup.add(win);

  // window frame
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(2.25, 2.0, 0.04),
    new THREE.MeshBasicMaterial({ color: 0x2a2a2a })
  );
  frame.position.set(x, 1.0, storeD/2+0.005);
  windowGroup.add(frame);
});

/* ---------- automatic door ---------- */
const door = new THREE.Group();
store.add(door);

const doorFrame = new THREE.Mesh(
  new THREE.BoxGeometry(1.4, 2.05, 0.06),
  toon(0x202024)
);

door.add(doorFrame);

const doorLeft = new THREE.Mesh(

  })
);
doorLeft.position.set(-0.34, 1.025, storeD/2+0.012);
door.add(doorLeft);

doorRight.position.x = 0.34;

// floor mat (welcome)
const floorMatMesh = new THREE.Mesh(

);

const floorMatRed = new THREE.Mesh(
  new THREE.PlaneGeometry(1.4, 0.55),

);
floorMatRed.rotation.x = -Math.PI/2;
floorMatRed.position.set(0, 0.042, storeD/2+0.5);
store.add(floorMatRed);
const floorMatText = new THREE.Mesh(
  new THREE.PlaneGeometry(1.2, 0.35),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
floorMatText.rotation.x = -Math.PI/2;
floorMatText.position.set(0, 0.043, storeD/2+0.5);

/* ---------- interior ---------- */
const interior = new THREE.Group();

// warm interior light

interiorLight.position.set(0, storeH-0.4, 0);

const interiorLight2 = new THREE.PointLight(0xfff0c8, 2.5, 10, 1.8);
interiorLight2.position.set(1.5, storeH-0.6, 1.2);

// floor guide stripes (yellow)
for (let i=0;i<6;i++){

    new THREE.PlaneGeometry(0.06, 0.6),

  );

  stripe.position.set(-2.0+i*0.9, 0.045, storeD/2-1.2);

}

// shelf helpers
function makeShelf(x, z, w=0.9, h=1.7, d=0.4, color=0xf3ede0){
  const g = new THREE.Group();
  // frame
  const side1 = new THREE.Mesh(new THREE.BoxGeometry(0.04, h, d), toon(0xaaaaaa));
  side1.position.set(-w/2, h/2, 0); g.add(side1);
  const side2 = side1.clone(); side2.position.x = w/2; g.add(side2);
  // shelves (4 levels)
  for (let i=0;i<4;i++){
    const shelf = new THREE.Mesh(
      new THREE.BoxGeometry(w, 0.04, d),
      toon(color)
    );
    shelf.position.set(0, i*(h/3)+0.1, 0); g.add(shelf);
    // shelf front strip
    const strip = new THREE.Mesh(
      new THREE.BoxGeometry(w, 0.05, 0.02),
      new THREE.MeshBasicMaterial({ color: 0xeeeeee })
    );
    strip.position.set(0, i*(h/3)+0.1, d/2+0.005); g.add(strip);
  }
  g.position.set(x, 0.04, z);
  return g;
}

function makeProducts(parent, x0, y0, z0, w, h, d, colors, count=12){
  for (let i=0;i<count;i++){
    const c = colors[i % colors.length];
    const pw = w*(0.6 + Math.random()*0.3);
    const ph = h*(0.6 + Math.random()*0.3);
    const pd = d*(0.6 + Math.random()*0.3);
    const prod = new THREE.Mesh(
      new THREE.BoxGeometry(pw, ph, pd),
      toon(c)
    );
    const row = Math.floor(i/4);
    const col = i%4;
    prod.position.set(
      x0 + (col-1.5)*0.22 + (Math.random()-0.5)*0.04,
      y0 + ph/2,
      z0 + (row-1)*0.18 + (Math.random()-0.5)*0.02
    );
    addOutline(prod, 1.06);
    parent.add(prod);
  }
}

// back wall shelves (multiple)
const interiorShelves = new THREE.Group();

const shelfColors1 = [0xd04040, 0xf2a93c, 0xf5d24b, 0x6db04a, 0x4186c4, 0xe88cb4, 0x9a7ac4, 0xffffff, 0x2b3a52];

      s===2 ? shelfColors2 : shelfColors1,

}

// wires between poles (simple sagging lines using thin boxes / catenary)
function makeWire(p1, p2, sag=0.4){
  const points = [];
  const seg = 12;
  for (let i=0;i<=seg;i++){
    const t = i/seg;
    const x = p1.x + (p2.x-p1.x)*t;
    const z = p1.z + (p2.z-p1.z)*t;
    const y = p1.y + (p2.y-p1.y)*t - sag*Math.sin(t*Math.PI);
    points.push(new THREE.Vector3(x,y,z));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve, 16, 0.012, 4, false);
  const m = new THREE.Mesh(geo, toon(0x222222));
  return m;
}

function makePuddle(x, z, w, d){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1a2638'; ctx.fillRect(0,0,128,128);
  // bright reflection patches
  const grad = ctx.createRadialGradient(64, 64, 5, 64, 64, 60);
  grad.addColorStop(0, 'rgba(255,200,100,0.6)');
  grad.addColorStop(0.5, 'rgba(255,180,80,0.3)');
  grad.addColorStop(1, 'rgba(255,180,80,0)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,128,128);
  // secondary glow
  const grad2 = ctx.createRadialGradient(40, 30, 0, 40, 30, 30);
  grad2.addColorStop(0, 'rgba(170,210,255,0.4)');
  grad2.addColorStop(1, 'rgba(170,210,255,0)');
  ctx.fillStyle = grad2; ctx.fillRect(0,0,128,128);
  // edge variation
  for (let i=0;i<200;i++){
    ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.3})`;
    ctx.fillRect(Math.random()*128, Math.random()*128, 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: 0.85 });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI/2;
  m.position.set(x, 0.015, z);
  return m;
}
const puddlePositions = [
  [3.0, storeD/2 + 1.2, 1.6, 1.0],
  [1.2, storeD/2 + 2.2, 1.4, 1.2],
  [4.5, storeD/2 + 0.5, 1.0, 0.8],
  [-2.5, storeD/2 + 1.5, 0.9, 1.1],
  [-4.0, storeD/2 + 2.5, 1.2, 0.9],
  [0.5, storeD/2 + 3.0, 1.5, 1.0],
  [-3.5, 0, 0.8, 1.3],
];
const puddles = [];
puddlePositions.forEach(([x,z,w,d])=>{
  const p = makePuddle(x, z, w, d);
  puddleGroup.add(p);
  puddles.push(p);
});

/* ---------- rain ---------- */
const RAIN_COUNT = 4500;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(RAIN_COUNT * 3);
const rainVel = new Float32Array(RAIN_COUNT);
for (let i=0;i<RAIN_COUNT;i++){
  rainPos[i*3] = (Math.random()-0.5)*baseSize*2;
  rainPos[i*3+1] = Math.random()*12;
  rainPos[i*3+2] = (Math.random()-0.5)*baseSize*2;
  rainVel[i] = 0.25 + Math.random()*0.1;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.PointsMaterial({
  color: 0xa8c8e8,
  size: 0.04,
  transparent: true,
  opacity: 0.55,
  depthWrite: false
});
const rain = new THREE.Points(rainGeo, rainMat);
scene.add(rain);

/* ---------- splash particles ---------- */
const splashPool = [];
const SPLASH_MAX = 60;
function spawnSplash(x, z){
  if (splashPool.length > SPLASH_MAX) return;
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(180,210,235,0.7)';
  ctx.beginPath(); ctx.arc(16,16,4,0,Math.PI*2); ctx.fill();
  const t = new THREE.CanvasTexture(c);
  const m = new THREE.SpriteMaterial({ map: t, transparent: true, opacity: 0.7 });
  const s = new THREE.Sprite(m);
  s.scale.set(0.1, 0.1, 0.1);
  s.position.set(x, 0.05, z);
  s.userData.life = 0;
  s.userData.maxLife = 0.6;
  scene.add(s);
  splashPool.push(s);
}

/* ---------- puddle ripples ---------- */
const rippleGroup = new THREE.Group();
puddleGroup.add(rippleGroup);
function spawnRipple(x, z){
  const r = new THREE.Mesh(
    new THREE.RingGeometry(0.05, 0.08, 16),
    new THREE.MeshBasicMaterial({ color: 0xaaccdd, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
  );
  r.rotation.x = -Math.PI/2;
  r.position.set(x, 0.017, z);
  r.userData.life = 0;
  r.userData.maxLife = 1.2;
  rippleGroup.add(r);
}

/* ---------- awning drip ---------- */
const dripPool = [];
function spawnDrip(x, z){
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.025, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xa8c8e8 })
  );
  m.position.set(x, storeH-0.92+0.12, z);
  m.userData.vy = 0;
  m.userData.x = x;
  m.userData.z = z;
  scene.add(m);
  dripPool.push(m);
}

/* ---------- post-processing (bloom) ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.6, 0.6, 0.4
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0x88a0c0, 0.18));

const moonLight = new THREE.DirectionalLight(0x88a0c0, 0.4);
moonLight.position.set(-8, 12, 6);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -10;
moonLight.shadow.camera.right = 10;
moonLight.shadow.camera.top = 10;
moonLight.shadow.camera.bottom = -10;
moonLight.shadow.bias = -0.0005;
scene.add(moonLight);

// distant rim lights (city glow)
const cityLight1 = new THREE.PointLight(0xc04080, 1.2, 18, 2);
cityLight1.position.set(-6, 5, 8); scene.add(cityLight1);
const cityLight2 = new THREE.PointLight(0x4080c0, 1.0, 18, 2);
cityLight2.position.set(6, 5, -8); scene.add(cityLight2);

/* ---------- resize ---------- */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- animation ---------- */
const clock = new THREE.Clock();
let trafficTimer = 0;
let trafficState = 0;
let doorTimer = 0;
let doorOpen = false;
let doorAngle = 0;
let lastDrip = 0;
let lastRipple = 0;

function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  // rain
  const rp = rain.geometry.attributes.position.array;
  for (let i=0;i<RAIN_COUNT;i++){
    rp[i*3+1] -= rainVel[i] * dt * 8;
    rp[i*3] += 0.05 * dt;
    if (rp[i*3+1] < 0){
      rp[i*3+1] = 12;
      rp[i*3] = (Math.random()-0.5)*baseSize*2;
      rp[i*3+2] = (Math.random()-0.5)*baseSize*2;
      // splash on ground occasionally
      if (Math.random() < 0.04){
        spawnSplash(rp[i*3], rp[i*3+2]);
      }
      // ripples on puddles
      puddles.forEach(p=>{
        const dx = rp[i*3] - p.position.x;
        const dz = rp[i*3+2] - p.position.z;
        const w = p.geometry.parameters.width/2;
        const d = p.geometry.parameters.height/2;
        if (Math.abs(dx) < w && Math.abs(dz) < d && Math.random() < 0.05){
          spawnRipple(rp[i*3], rp[i*3+2]);
        }
      });
    }
  }
  rain.geometry.attributes.position.needsUpdate = true;

  // splash update
  for (let i=splashPool.length-1;i>=0;i--){
    const s = splashPool[i];
    s.userData.life += dt;
    s.material.opacity = 0.7 * (1 - s.userData.life/s.userData.maxLife);
    s.scale.multiplyScalar(1 + dt*3);
    if (s.userData.life >= s.userData.maxLife){
      scene.remove(s); s.material.dispose(); splashPool.splice(i,1);
    }
  }

  // ripple update
  for (let i=rippleGroup.children.length-1;i>=0;i--){
    const r = rippleGroup.children[i];
    r.userData.life += dt;
    const p = r.userData.life / r.userData.maxLife;
    r.scale.setScalar(1 + p*4);
    r.material.opacity = 0.6 * (1 - p);
    if (p >= 1){
      rippleGroup.remove(r); r.geometry.dispose(); r.material.dispose();
    }
  }

  // awning drip
  lastDrip += dt;
  if (lastDrip > 0.5){
    lastDrip = 0;
    if (Math.random() < 0.7){
      const dripX = (Math.random()-0.5)*storeW*0.8;
      spawnDrip(dripX, storeD/2 + 0.95 + 0.12 + store.position.z);
    }
  }
  for (let i=dripPool.length-1;i>=0;i--){
    const d = dripPool[i];
    d.userData.vy -= 9.8 * dt;
    d.position.y += d.userData.vy * dt;
    if (d.position.y < 0.1){
      // splash small
      spawnSplash(d.position.x, d.position.z);
      scene.remove(d); d.geometry.dispose(); d.material.dispose();
      dripPool.splice(i,1);
    }
  }

  // door animation
  doorTimer += dt;
  if (doorTimer > 8 + Math.random()*4){
    doorTimer = 0;
    doorOpen = !doorOpen;
  }
  const targetAngle = doorOpen ? 1 : 0;
  doorAngle += (targetAngle - doorAngle) * dt * 1.2;
  doorLeft.position.z = storeD/2+0.012 + doorAngle*0.35;
  doorLeft.position.x = -0.34 - doorAngle*0.05;
  doorRight.position.z = storeD/2+0.012 + doorAngle*0.35;
  doorRight.position.x = 0.34 + doorAngle*0.05;

  // sign flicker
  signMat.opacity = 0.95 + Math.sin(t*3.2)*0.05 + (Math.random() < 0.04 ? -0.3 : 0);
  signSide.material.opacity = signMat.opacity;

  // traffic light cycle
  trafficTimer += dt;
  if (trafficTimer > 5){
    trafficTimer = 0;
    trafficState = (trafficState + 1) % 3;
  }
  const tg = trafficGroup.children;
  // red on, others dim
  const colors = [
    [1.0, 0.15, 0.15],
    [0.7, 0.55, 0.15],
    [0.15, 0.85, 0.35],
  ];
  const currentCol = new THREE.Color(...colors[trafficState]);
  const dimCol = new THREE.Color(0.18, 0.18, 0.18);
  [tRed, tYellow, tGreen].forEach((lamp, i)=>{
    if (i === trafficState){
      lamp.material.color.copy(currentCol);
    } else {
      lamp.material.color.copy(dimCol);
    }
  });

  // vending machine gentle glow pulse
  vending1.children.forEach(c=>{
    if (c.isPointLight) c.intensity = 1.8 + Math.sin(t*2 + c.position.x)*0.2;
  });
  vending2.children.forEach(c=>{
    if (c.isPointLight) c.intensity = 1.8 + Math.sin(t*2.5 + c.position.x)*0.2;
  });

  // oden gentle steam effect (subtle)
  odenLight.intensity = 1.4 + Math.sin(t*1.5)*0.2;

  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
